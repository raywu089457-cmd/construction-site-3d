<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>工地場景</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background:#0b0d10; color:#e8eaed; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
  canvas { display: block; touch-action: none; }
  header { position: fixed; top:0; left:0; right:0; z-index:10;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: linear-gradient(#0b0d10ee,#0b0d1000); pointer-events:none; }
  h1 { margin:0; font-size:15px; font-weight:600; }
  #sub { font-size:11px; color:#8b929c; margin-top:2px; }
  #bar { position: fixed; left:0; right:0; bottom:0; z-index:10;
    padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background: linear-gradient(#0b0d1000,#0b0d10f2 30%);
    display:flex; gap:6px; align-items:center; }
  #bar button { flex:1; background:#14181ecc; border:1px solid #222833; color:#c7ccd4;
    border-radius:9px; padding:9px 6px; font-size:11px; font-weight:600; }
  #bar button.on { border-color:#1f6feb; background:#16202e; color:#fff; }
  #loading { position: fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0b0d10; z-index:20; font-size:13px; color:#8b929c; transition:opacity .4s; }
  @media (max-height:560px) { h1{font-size:13px} #sub{display:none} header{padding-top:calc(env(safe-area-inset-top) + 5px)} }
</style>
</head>
<body>
<header>
  <h1>工地場景</h1>
  <div id="sub">SimReady 圍籬道具 ＋ 免費包塔吊機具</div>
</header>
<div id="loading">載入中…</div>
<div id="bar">
  <button id="v-over" class="on">俯瞰</button>
  <button id="v-ground">地面</button>
  <button id="v-gate">大門</button>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const R = THREE.MathUtils.degToRad;

// layout: real metres, ground is the 100x100 plot from the OpenGameArt pack
const LAYOUT = [
  // no Ground.glb: its terrain has 3.6 m of relief, which buried every prop
  // placed at y=0 (fences, barricades, gates all vanished into the sand)
  { f:'free/Fence.glb',             p:[0,0,0],          r:[0,0,0],          s:0.97 },
  { f:'free/Building.glb',          p:[-10,0,-20],      r:[0,R(-8),0],      s:0.72 },
  { f:'free/Crane-On-Ground.glb',   p:[26,0,-30],       r:[0,R(35),0],      s:0.85 },
  { f:'free/Containers-Office.glb', p:[33,0,16],        r:[0,R(-90),0],     s:0.9 },
  { f:'free/Containers.glb',        p:[-38,0,22],       r:[0,R(20),0] },
  { f:'free/Trucks.glb',            p:[-20,0,34],       r:[0,R(15),0] },
  { f:'free/Construction-Materials.glb', p:[2,0,30],    r:[0,R(90),0] },
  { f:'free/excavator.glb',         p:[14,0,24],        r:[0,R(-140),0] },
  { f:'free/forklift.glb',          p:[-6,0,40],        r:[0,R(200),0] },
  { f:'gate_safety.glb',            p:[-7,0,46],        r:[0,R(8),0] },
  { f:'gate_safety.glb',            p:[5,0,47],         r:[0,R(-6),0] },
  { f:'gate_dock.glb',              p:[24,0,44],        r:[0,R(40),0] },
  // SimReady props, repeated
  { f:'barricade.glb', p:[-28,0,44], r:[0,R(20),0] },
  { f:'barricade.glb', p:[-21,0,45], r:[0,R(-12),0] },
  { f:'barricade.glb', p:[-14,0,46], r:[0,R(6),0] },
  { f:'barricade.glb', p:[16,0,43],  r:[0,R(70),0] },
  { f:'orange.glb',    p:[-30,0,36], r:[0,R(90),0] },
  { f:'orange.glb',    p:[-26,0,33], r:[0,R(90),0] },
  { f:'orange.glb',    p:[20,0,33],  r:[0,R(-90),0] },
  { f:'metal.glb',     p:[8,0,41],   r:[0,R(-20),0] },
  { f:'metal.glb',     p:[11,0,42],  r:[0,R(-20),0] },
  { f:'scene/wheelbarrow.glb', p:[6,0,34],  r:[0,R(55),0] },
  { f:'scene/crate_ply.glb',   p:[-14,0,14], r:[0,R(12),0] },
  { f:'scene/crate_ply.glb',   p:[-13,0.5,16], r:[0,R(-8),0] },
  { f:'scene/crate_gray.glb',  p:[-18,0,12], r:[0,R(30),0] },
  { f:'scene/crate_gray.glb',  p:[-18,0.2,12.6], r:[0,R(-15),0] },
  { f:'scene/drum_steel.glb',  p:[-33,0,10], r:[0,0,0] },
  { f:'scene/drum_steel.glb',  p:[-32,0,11.2], r:[0,0,0] },
  { f:'scene/drum_blue.glb',   p:[-31,0,9.4],  r:[0,0,0] },
  { f:'scene/drum_blue.glb',   p:[-31.6,0,10.8], r:[0,0,0] },
  { f:'scene/bucket_red.glb',  p:[-29,0,12],   r:[0,0,0] },
  { f:'scene/bucket_red.glb',  p:[-29.6,0,12.8], r:[0,0,0] },
];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
scene.fog = new THREE.Fog(0x0b0d10, 90, 260);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 900);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 3;
controls.maxDistance = 320;

scene.add(new THREE.HemisphereLight(0xc2d8ee, 0x1b222b, 1.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.5);
sun.position.set(70, 110, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.002;
Object.assign(sun.shadow.camera, { left:-80, right:80, top:80, bottom:-80, near:1, far:400 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x9fb4cf, 0.55).translateX(-60).translateY(40));

// flat site ground
const plot = new THREE.Mesh(
  new THREE.PlaneGeometry(150, 150),
  new THREE.MeshStandardMaterial({ color: 0xb9997a, roughness: 0.97 })
);
plot.rotation.x = -Math.PI/2;
plot.receiveShadow = true;
scene.add(plot);
const apron = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x2b3138, roughness: 1 })
);
apron.rotation.x = -Math.PI/2;
apron.position.y = -0.05;
scene.add(apron);
const gridHelper = new THREE.GridHelper(300, 150, 0x3a4653, 0x272f38);
gridHelper.position.y = -0.04;
gridHelper.material.opacity = 0.35;
gridHelper.material.transparent = true;
scene.add(gridHelper);

const loader = new GLTFLoader();
const seenGeo = new Set();
let pending = 0, failed = 0;

function prep(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    if (seenGeo.has(o.geometry.uuid)) { }        // same geometry reused by an
    seenGeo.add(o.geometry.uuid);                // instance: keep it visible
    o.castShadow = true; o.receiveShadow = true;
  });
}

const loadingEl = document.getElementById('loading');
const entries = {};
LAYOUT.forEach((spec, i) => {
  if (entries[spec.f]) return;                   // load each file once
  entries[spec.f] = null;
  pending++;
  loader.load('models/' + spec.f,
    (gltf) => {
      entries[spec.f] = gltf.scene;
      pending--; check();
    },
    undefined,
    (e) => { failed++; pending--; console.error('load fail', spec.f, e); check(); }
  );
});

function check() {
  if (pending > 0) return;
  // second pass: instance everything now that the sources are in
  LAYOUT.forEach((spec) => {
    const src = entries[spec.f];
    if (!src) return;
    const obj = (LAYOUT.filter(s => s.f === spec.f).length > 1) ? src.clone(true) : src;
    obj.position.set(...spec.p);
    obj.rotation.set(...spec.r);
    if (spec.s) obj.scale.setScalar(spec.s);
    prep(obj);
    if (obj.parent === null) scene.add(obj);
  });
  loadingEl.style.opacity = '0';
  setTimeout(() => loadingEl.remove(), 450);
  view('over');
  window.__ready = true;
}

// cameras
const VIEWS = {
  over:   { pos:[96, 78, 118], tgt:[-2, 10, -2] },
  ground: { pos:[10, 2.4, 48], tgt:[0, 3, 12] },
  gate:   { pos:[2, 4.0, 62],  tgt:[-4, 4, 42] },
};
function view(name) {
  const v = VIEWS[name];
  const portrait = innerWidth/innerHeight < 1;
  const k = portrait ? 1.35 : 1;
  controls.target.set(...v.tgt);
  camera.position.set(v.pos[0]*k, v.pos[1]*(portrait?1.1:1), v.pos[2]*k);
  controls.update();
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', b.id === 'v-'+name));
}
document.getElementById('v-over').onclick   = () => view('over');
document.getElementById('v-ground').onclick = () => view('ground');
document.getElementById('v-gate').onclick   = () => view('gate');

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
