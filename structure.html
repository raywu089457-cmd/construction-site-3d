<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* 台灣常用規格（CNS / 營造安全衛生設施標準）
   模板   4×8 呎膠合板 122×244 cm、18 mm 厚；柳安角材 1.5"×1.5"（約 38 mm）
   支柱   可調鋼管支柱（俗稱烏龜）φ48.6×2.3 mm，常用 2.1–3.6 m
   鋼筋   竹節鋼筋 CNS 560：SD280 / SD420；#3(10) #4(13) #5(16) #6(19) #7(22) #8(25)
   混凝土 210 / 280 / 350 kgf/cm²
   施工架 框式施工架（門型框）1.83 m 寬 × 1.90 m 高，φ48.6 鋼管
          護欄上欄杆 90 cm、中欄杆 45 cm、踢腳板 18 cm、壁連座縱 5.5 m 橫 4.5 m  */
const SPEC_TW = {
  panelW: 1.219, panelH: 2.438, panelT: 0.018,   // 4×8 呎膠合板
  batten: 0.038,                                  // 柳安角材 1.5"×1.5"
  propDia: 0.0486,                                // 可調鋼管支柱 φ48.6
  frameW: 1.83, frameH: 1.90,                     // 門型框
  toeH: 0.18, railTop: 0.90, railMid: 0.45,
};

const REBAR = { '#3':10, '#4':13, '#5':16, '#6':19, '#7':22, '#8':25 };

/* ------------------------------------------------------------------ renderer */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(42, (innerWidth-224)/innerHeight, 0.05, 300);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth-224, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position='fixed';
renderer.domElement.style.left='224px';

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 0.6;
controls.maxDistance = 70;
controls.target.set(0, 1.6, 0);
camera.position.set(4.4, 3.4, 5.6);

scene.add(new THREE.HemisphereLight(0xc8ddf2, 0x1b222b, 1.15));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.9);
sun.position.set(6, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.0012;
Object.assign(sun.shadow.camera, { left:-14, right:14, top:14, bottom:-14, near:0.5, far:44 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x9fb4cf, 0.5).translateX(-8).translateY(5));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(140,140),
  new THREE.MeshStandardMaterial({ color:0x343b45, roughness:0.97 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(140, 140, 0x46525f, 0x2a323b);
grid.position.y = 0.002; grid.material.opacity = 0.45; grid.material.transparent = true; scene.add(grid);

/* ----------------------------------------------------------------- materials */
const tex = new THREE.TextureLoader();
const cache = {};
function pbr(name, repeat=[2,2], opts={}) {
  const key = name + repeat.join(',');
  if (cache[key]) return cache[key];
  const base = `textures/${name}/`;
  const load = (f, srgb) => {
    const t = tex.load(base + f);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(...repeat);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  const m = new THREE.MeshStandardMaterial({
    map: load('map_1k.jpg', true),
    normalMap: load('normalMap_1k.jpg'),
    roughnessMap: load('roughnessMap_1k.jpg'),
    metalness: opts.metalness ?? 0,
    color: opts.color ?? 0xffffff,
  });
  cache[key] = m;
  return m;
}
const MAT = {
  concrete: (grade) => pbr('brushed_concrete', [1.4,1.4], { color: grade >= 350 ? 0xb9bec4 : 0xc6c6c1 }),
  plywood:  () => pbr('plywood', [2.5,2.5]),
  timber:   () => pbr('plywood', [3,1], { color: 0xcbb089 }),
  steel:    () => pbr('rusty_metal', [5,5], { metalness: 0.8, color: 0xb8bcc0 }),
  rebar:    () => pbr('rusty_metal', [4,4], { metalness: 0.85, color: 0x9a6a4a }),
};

/* ------------------------------------------------------------------ geometry */
function box(w,h,d, x,y,z) { const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); return g; }
function cyl(r,h, x,y,z, axis='y') {
  const g = new THREE.CylinderGeometry(r,r,h, 10, 1, false);
  if (axis==='x') g.rotateZ(Math.PI/2);
  if (axis==='z') g.rotateX(Math.PI/2);
  g.translate(x,y,z);
  return g;
}

/* ---- 1. 混凝土 ----------------------------------------------------------- */
function buildConcrete(P) {
  const g = [];
  if (P.form === '柱') g.push(box(P.a, P.h, P.b, 0, P.h/2, 0));
  else if (P.form === '樑') g.push(box(P.L, P.h, P.b, 0, P.h/2, 0));
  else if (P.form === '板') g.push(box(P.L, P.t, P.W, 0, P.t/2, 0));
  else g.push(box(P.L, P.h, P.t, 0, P.h/2, 0));
  return [{ geo: mergeGeometries(g), mat: MAT.concrete(P.grade) }];
}

/* ---- 2. 模板（4×8 呎膠合板 + 柳安角材 + 柱箍鐵） ------------------------- */
function buildFormwork(P) {
  const { panelT, batten } = SPEC_TW;
  const gap = P.gap;
  const out = [];
  const ply = MAT.plywood();
  const timber = MAT.timber();
  const steel = MAT.steel();

  const w = P.a + gap*2, d = P.b + gap*2, h = P.h;
  const plyGeos = [];
  // 四面膠合板（每 122 cm 一道接縫，用細縫模擬）
  const panelPer = Math.max(1, Math.round(h / SPEC_TW.panelH));
  for (const [sx, sz, sw, sd] of [
    [ (w+panelT)/2, 0, panelT, d+panelT*2 ],
    [-(w+panelT)/2, 0, panelT, d+panelT*2 ],
    [ 0,  (d+panelT)/2, w, panelT ],
    [ 0, -(d+panelT)/2, w, panelT ],
  ]) {
    if (sw < sd) {
      const seg = h / panelPer;
      for (let i = 0; i < panelPer; i++)
        plyGeos.push(box(sw, seg - 0.006, sd, sx, seg*(i+0.5), sz));
    } else {
      const seg = h / panelPer;
      for (let i = 0; i < panelPer; i++)
        plyGeos.push(box(sw, seg - 0.006, sd, sx, seg*(i+0.5), sz));
    }
  }
  out.push({ geo: mergeGeometries(plyGeos), mat: ply });

  // 柳安角材：垂直角材每 30 cm 一支 + 水平角材每 45 cm 一道
  const timberGeos = [];
  const vStep = 0.30;
  for (const side of [-1, 1]) {
    const x = side * (w/2 + panelT + batten/2);
    for (let z = -d/2 + vStep/2; z < d/2; z += vStep)
      timberGeos.push(box(batten, h, batten, x, h/2, z));
  }
  for (const side of [-1, 1]) {
    const z = side * (d/2 + panelT + batten/2);
    for (let x = -w/2 + vStep/2; x < w/2; x += vStep)
      timberGeos.push(box(batten, h, batten, x, h/2, z));
  }
  const hStep = 0.45;
  for (let y = hStep; y < h; y += hStep) {
    for (const side of [-1, 1]) {
      timberGeos.push(box(batten, batten, d + panelT*2 + batten*2, side*(w/2 + panelT + batten/2), y, 0));
      timberGeos.push(box(w + panelT*2 + batten*2, batten, batten, 0, y, side*(d/2 + panelT + batten/2)));
    }
  }
  out.push({ geo: mergeGeometries(timberGeos), mat: timber });

  // 柱箍鐵（角鐵箍）每 45 cm 一道 + 對拉螺栓
  const clampGeos = [];
  const clampStep = 0.45;
  const cw = w + panelT*2 + batten*2 + 0.02;
  const cd = d + panelT*2 + batten*2 + 0.02;
  for (let y = clampStep*0.6; y < h; y += clampStep) {
    clampGeos.push(box(cw + 0.05, 0.05, 0.05, 0, y,  cd/2));
    clampGeos.push(box(cw + 0.05, 0.05, 0.05, 0, y, -cd/2));
    clampGeos.push(box(0.05, 0.05, cd,  cw/2, y, 0));
    clampGeos.push(box(0.05, 0.05, cd, -cw/2, y, 0));
    clampGeos.push(cyl(0.011, cw + 0.14, 0, y, 0, 'x'));
    clampGeos.push(cyl(0.03, 0.024, (cw/2+0.06), y, 0, 'x'));
    clampGeos.push(cyl(0.03, 0.024, -(cw/2+0.06), y, 0, 'x'));
  }
  out.push({ geo: mergeGeometries(clampGeos), mat: steel });
  return out;
}

/* ---- 3. 鋼筋（竹節鋼筋 CNS 560） ----------------------------------------- */
function buildRebar(P) {
  const mat = MAT.rebar();
  const r = REBAR[P.bar] / 1000 / 2;
  const cover = P.cover;
  const geos = [];

  if (P.form === '柱') {
    const sx = P.a - cover*2, sz = P.b - cover*2, h = P.h;
    // 主筋
    for (const x of [-sx/2, sx/2]) for (const z of [-sz/2, sz/2])
      geos.push(cyl(r, h, x, h/2, z));
    // 箍筋 #3 @ 間距
    const rs = REBAR['#3'] / 1000 / 2;
    for (let y = P.space; y < h; y += P.space) {
      geos.push(box(sx + rs*2, rs*2, rs*2, 0, y,  sz/2));
      geos.push(box(sx + rs*2, rs*2, rs*2, 0, y, -sz/2));
      geos.push(box(rs*2, rs*2, sz,  sx/2, y, 0));
      geos.push(box(rs*2, rs*2, sz, -sx/2, y, 0));
    }
  } else {
    const L = P.L, W = P.W, t = P.t, rs = r;
    const sx = L - cover*2, sz = W - cover*2;
    for (const y of [cover, t - cover]) {
      for (let z = -sz/2; z <= sz/2 + 1e-6; z += P.space) geos.push(cyl(rs, sx, 0, y, z, 'x'));
      for (let x = -sx/2; x <= sx/2 + 1e-6; x += P.space) geos.push(cyl(rs, sz, x, y, 0, 'z'));
    }
  }
  return [{ geo: mergeGeometries(geos), mat }];
}

/* ---- 4. 可調鋼管支柱（模板支撐，俗稱烏龜） ------------------------------- */
function buildProps(P) {
  const out = [];
  const steel = MAT.steel();
  const g = [];
  const { propDia } = SPEC_TW;
  const H = P.h;
  const sx = P.spanX, sz = P.spanZ;
  for (let x = -sx/2; x <= sx/2 + 1e-6; x += P.space)
    for (let z = -sz/2; z <= sz/2 + 1e-6; z += P.space) {
      g.push(cyl(propDia/2, H, x, H/2, z));
      g.push(box(0.14, 0.012, 0.14, x, 0.006, z));            // 底板
      g.push(box(0.16, 0.008, 0.05, x, H, z));                // U 型托座
      g.push(box(0.05, 0.008, 0.16, x, H, z));
      g.push(cyl(0.03, 0.06, x, H*0.45, z));                   // 調整螺紋套
    }
  out.push({ geo: mergeGeometries(g), mat: steel });
  // 上方木角材（大引／小引）
  const timber = MAT.timber();
  const tg = [];
  for (let z = -sz/2; z <= sz/2 + 1e-6; z += P.space)
    tg.push(box(sx + 0.1, 0.09, 0.09, 0, H + 0.05, z));
  out.push({ geo: mergeGeometries(tg), mat: timber });
  return out;
}

/* ---- 5. 框式施工架（門型框，營造安全衛生設施標準） ---------------------- */
function buildScaffold(P) {
  const out = [];
  const steel = MAT.steel();
  const plank = MAT.plywood();
  const { frameW, frameH, toeH, railTop, railMid, propDia } = SPEC_TW;
  const r = propDia / 2;
  const levels = P.levels, bays = P.bays, depth = P.rows * 0.75;  // 排距常 0.75 m

  const g = [];
  const H = frameH * levels;
  const W = frameW * bays;

  // 門型框：每跨一榀，兩根立桿 + 上下橫桿 + 框內斜撐
  for (let i = 0; i <= bays; i++) {
    const x = i * frameW;
    for (let l = 0; l < levels; l++) {
      const y0 = l * frameH;
      for (const z of [0, depth]) {
        g.push(cyl(r, frameH, x, y0 + frameH/2, z));            // 立桿
      }
      for (const yy of [y0 + 0.15, y0 + frameH - 0.15]) {
        g.push(cyl(r*0.9, depth, x, yy, depth/2, 'z'));         // 上下橫桿
      }
      // 框內交叉斜撐
      const len = Math.hypot(depth, frameH - 0.3);
      const ang = Math.atan2(frameH - 0.3, depth);
      for (const s of [1, -1]) {
        const gg = new THREE.CylinderGeometry(r*0.7, r*0.7, len, 8);
        gg.rotateX(Math.PI/2 - ang * s);
        gg.translate(x, y0 + frameH/2, depth/2);
        g.push(gg);
      }
      g.push(box(0.12, 0.01, 0.12, x, y0 + 0.005, 0));          // 底座
      g.push(box(0.12, 0.01, 0.12, x, y0 + 0.005, depth));
    }
  }
  // 交叉拉桿（跨與跨之間）
  for (let i = 0; i < bays; i++) {
    for (let l = 0; l < levels; l++) {
      const y0 = l*frameH, y1 = (l+1)*frameH;
      const len = Math.hypot(frameW, frameH);
      const ang = Math.atan2(frameH, frameW);
      for (const z of [0, depth]) {
        for (const s of [1, -1]) {
          const gg = new THREE.CylinderGeometry(r*0.75, r*0.75, len, 8);
          gg.rotateZ(Math.PI/2 - ang*s);
          gg.translate((i+0.5)*frameW, (y0+y1)/2, z);
          g.push(gg);
        }
      }
    }
  }
  out.push({ geo: mergeGeometries(g), mat: steel });

  // 踏板（工作台）+ 護欄 + 踢腳板
  const planks = [], rails = [], toes = [];
  for (let l = 1; l <= levels; l++) {
    const y = l * frameH;
    planks.push(box(W, 0.05, depth*0.92, W/2, y + 0.025, depth/2));
    // 護欄（外側）
    rails.push(cyl(0.021, W, W/2, y + railTop, depth, 'x'));
    rails.push(cyl(0.021, W, W/2, y + railMid, depth, 'x'));
    rails.push(cyl(0.021, depth, 0, y + railTop, depth/2, 'z'));
    rails.push(cyl(0.021, depth, W, y + railTop, depth/2, 'z'));
    // 踢腳板 18 cm
    toes.push(box(W, toeH, 0.012, W/2, y + toeH/2, depth + 0.006));
  }
  if (planks.length) out.push({ geo: mergeGeometries(planks), mat: plank });
  if (rails.length) out.push({ geo: mergeGeometries(rails), mat: steel });
  if (toes.length) out.push({ geo: mergeGeometries(toes), mat: plank });

  // 壁連座（繫牆桿）：縱向 5.5 m、橫向 4.5 m 一道，鎖在結構體外牆上
  if (P.wall === '有') {
    const ties = [];
    for (let y = frameH; y <= H + 0.01; y += 4.5) {
      for (let x = 0; x <= W + 0.01; x += 5.5) {
        ties.push(cyl(0.024, 1.35, x, y, -0.675, 'z'));   // 繫牆桿
        ties.push(cyl(0.035, 0.03, x, y, -1.34, 'z'));    // 牆面墊板
      }
    }
    if (ties.length) out.push({ geo: mergeGeometries(ties), mat: steel });
    // 被施工的外牆（示意），讓繫牆桿有東西可鎖
    const wallGeo = new THREE.BoxGeometry(W + 0.6, H + 0.9, 0.22);
    wallGeo.translate(W / 2, (H + 0.9) / 2, -1.46);
    out.push({ geo: wallGeo, mat: MAT.concrete(280), ghost: true });
  }
  return out;
}

/* ---- 6. 施工順序組合 ----------------------------------------------------- */
function buildCombo(P) {
  const out = [];
  const a = 0.4, b = 0.4, h = P.h;
  const shift = (arr, dx) => arr.map(o => { o.geo.translate(dx, 0, 0); return o; });
  // 1 鋼筋  2 混凝土  3 模板  4 支撐  5 施工架
  out.push(...shift(buildRebar({ form:'柱', bar:'#6', space:0.15, cover:0.04, a, b, h }), -2.6));
  out.push(...shift(buildConcrete({ form:'柱', a, b, h, grade:280 }), -1.3));
  out.push(...shift(buildFormwork({ a, b, h, gap:0.02 }), 0));
  out.push(...shift(buildProps({ h: h*0.98, spanX:1.2, spanZ:1.2, space:0.6 }), 1.9));
  out.push(...shift(buildScaffold({ levels:Math.min(2,P.levels), bays:2, rows:1, wall:true }), 3.2));
  return out;
}

/* --------------------------------------------------------------------- spec */
const SPEC = {
  '混凝土': {
    title: '混凝土構件',
    desc: '柱 / 樑 / 板 / 牆',
    notes: () => '混凝土強度 CNS 3090：210 / 280 / 350 kgf/cm²（≈20 / 27 / 34 MPa）；坍度常用 15 cm',
    build: buildConcrete,
    p: { form:{label:'形式', opts:['柱','樑','板','牆'], def:'柱'},
         grade:{label:'強度 (kgf/cm²)', opts:['210','280','350'], def:'280'},
         a:{label:'柱寬 a (m)', min:0.2, max:1.2, step:0.05, def:0.4},
         b:{label:'柱深 b (m)', min:0.2, max:1.2, step:0.05, def:0.4},
         h:{label:'高 h (m)', min:0.5, max:5, step:0.1, def:2.8},
         L:{label:'長 L (m)', min:1, max:12, step:0.5, def:6},
         W:{label:'寬 W (m)', min:1, max:12, step:0.5, def:6},
         t:{label:'厚 t (m)', min:0.1, max:0.4, step:0.02, def:0.15} },
  },
  '模板': {
    title: '柱模板',
    desc: '4×8 呎膠合板 + 柳安角材 + 柱箍鐵',
    notes: () => '膠合板 122×244 cm × 18 mm；角材 1.5"×1.5"；柱箍鐵每 45 cm；對拉螺栓 φ11',
    build: buildFormwork,
    p: { a:{label:'柱寬 (m)', min:0.2, max:1.2, step:0.05, def:0.4},
         b:{label:'柱深 (m)', min:0.2, max:1.2, step:0.05, def:0.4},
         h:{label:'柱高 (m)', min:0.5, max:5, step:0.1, def:2.8},
         gap:{label:'模板間隙 (m)', min:0, max:0.06, step:0.005, def:0.02} },
  },
  '鋼筋': {
    title: '竹節鋼筋',
    desc: '柱（主筋＋#3 箍筋）/ 板（雙層雙向）',
    notes: () => 'CNS 560 SD280 / SD420；#3=13 #4=13 #5=16 #6=19 #7=22 #8=25 mm；保護層 柱 4 cm、板 2 cm',
    build: buildRebar,
    p: { form:{label:'形式', opts:['柱','板'], def:'柱'},
         bar:{label:'主筋號數', opts:['#3','#4','#5','#6','#7','#8'], def:'#6'},
         space:{label:'箍筋/鋼筋間距 (m)', min:0.1, max:0.4, step:0.01, def:0.15},
         cover:{label:'保護層 (m)', min:0.02, max:0.1, step:0.005, def:0.04},
         a:{label:'柱寬 (m)', min:0.2, max:1.2, step:0.05, def:0.4},
         b:{label:'柱深 (m)', min:0.2, max:1.2, step:0.05, def:0.4},
         h:{label:'柱高 (m)', min:0.5, max:5, step:0.1, def:2.8},
         L:{label:'板長 (m)', min:1, max:10, step:0.5, def:4},
         W:{label:'板寬 (m)', min:1, max:10, step:0.5, def:4},
         t:{label:'板厚 (m)', min:0.1, max:0.4, step:0.02, def:0.15} },
  },
  '模板支撐': {
    title: '可調鋼管支柱',
    desc: '俗稱「烏龜」，撐樓板模板用',

    p: { h:{label:'支撐高 (m)', min:1.5, max:4, step:0.1, def:2.8},
         space:{label:'間距 (m)', min:0.4, max:1.2, step:0.1, def:0.6},
         spanX:{label:'縱向跨 (m)', min:0.6, max:4, step:0.2, def:1.8},
         spanZ:{label:'橫向跨 (m)', min:0.6, max:4, step:0.2, def:1.2} },

  '框式施工架': {

    build: buildScaffold,
    p: { levels:{label:'層數', min:1, max:4, step:1, def:2},
         bays:{label:'跨數', min:1, max:6, step:1, def:3},

  '施工順序': {
    title: '一層樓施工順序',
    desc: '鋼筋 → 混凝土 → 模板 → 支撐 → 施工架',
    notes: () => '實際順序為 放樣 → 綁鋼筋 → 組模板+支撐 → 澆置 → 養護 → 拆模 → 架施工架',
    build: buildCombo,
    p: { h:{label:'柱高 (m)', min:1, max:5, step:0.1, def:2.8},
         levels:{label:'施工架層數', min:1, max:4, step:1, def:2} },
  },
};

/* --------------------------------------------------------------------- UI */
const state = { mode:'混凝土', vals:{} };
const group = new THREE.Group();
scene.add(group);

function valsFor(mode) {
  if (state.vals[mode]) return state.vals[mode];
  const v = {};
  for (const [k, s] of Object.entries(SPEC[mode].p)) v[k] = s.def;
  state.vals[mode] = v;
  return v;
}

function buildTabs() {
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  Object.keys(SPEC).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    b.className = (k === state.mode ? 'on' : '');
    b.onclick = () => { state.mode = k; buildTabs(); buildParams(); rebuild(); };
    wrap.appendChild(b);
  });
}

function buildParams() {
  const spec = SPEC[state.mode];
  const vals = valsFor(state.mode);
  const wrap = document.getElementById('params');
  wrap.innerHTML = '';
  document.getElementById('title').textContent = spec.title;
  document.getElementById('desc').textContent = spec.desc;
  document.getElementById('spec').textContent = spec.notes ? spec.notes() : '';

  for (const [k, s] of Object.entries(spec.p)) {
    const row = document.createElement('div');
    row.className = 'p';
    if (s.opts) {
      row.innerHTML = `<label>${s.label}</label><div class="row"></div>`;
      const r = row.querySelector('.row');
      s.opts.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o;
        b.className = (String(vals[k]) === String(o) ? 'on' : '');
        b.onclick = () => { vals[k] = o; buildParams(); rebuild(); };
        r.appendChild(b);
      });
    } else {
      row.innerHTML = `<label>${s.label}<b>${vals[k]}</b></label>
        <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${vals[k]}">`;
      row.querySelector('input').oninput = (e) => {
        vals[k] = +e.target.value;
        row.querySelector('b').textContent = vals[k];
        rebuild();
      };
    }
    wrap.appendChild(row);
  }
}

let triCount = 0;
function rebuild() {
  const spec = SPEC[state.mode];
  const vals = state.vals[state.mode];
  while (group.children.length) {
    const c = group.children.pop();
    c.geometry?.dispose();
  }
  triCount = 0;
  for (const { geo, mat, ghost } of spec.build(vals)) {
    if (!geo) continue;
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = !ghost; m.receiveShadow = true;
    if (ghost) { m.material = mat.clone(); m.material.transparent = true; m.material.opacity = 0.35; }
    group.add(m);
    const n = geo.index ? geo.index.count : geo.attributes.position.count;
    triCount += n / 3;
  }
  document.getElementById('stat').textContent =
    `${Math.round(triCount).toLocaleString()} 三角形 · 拖曳旋轉 · 滾輪縮放`;
  fitView();
}

function fitView() {
  const bb = new THREE.Box3().setFromObject(group);
  if (bb.isEmpty()) return;
  const c = bb.getCenter(new THREE.Vector3());
  const s = bb.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.y, s.z) * 1.7;
  controls.target.copy(c);
  camera.position.set(c.x + d*0.7, c.y + d*0.55, c.z + d*0.85);
  controls.update();
}

buildTabs(); buildParams(); rebuild();
window.__ready = true;

addEventListener('resize', () => {
  const w = innerWidth - 224;
  camera.aspect = w / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(w, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
