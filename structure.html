<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* 台灣規範：CNS 560 竹節鋼筋、CNS 5644 可調鋼管支柱、CNS 3090 混凝土
   營造安全衛生設施標準 §23 模板支撐、§39 施工架                       */
const TW = {
  ply:0.018, panelW:1.219, panelH:2.438, batten:0.038,
  tube:0.0486, rail:0.033, clampTube:0.0486,
  frameW:1.83, frameH:1.90, toe:0.18, railTop:0.90, railMid:0.45,
};
/* CNS 560 A2006 鋼筋標稱直徑（mm）、標稱斷面積（cm²）、單位重（kg/m）
   —— 用真實標稱值，不是工地口語的四捨五入（#3 是 9.53 不是 10） */
const REBAR = {
  '#3': 9.53,  '#4': 12.70, '#5': 15.88, '#6': 19.05,
  '#7': 22.23, '#8': 25.40, '#9': 28.65, '#10': 32.26, '#11': 35.81,
};
const REBAR_INFO = {
  '#3':  { d:'D10', area:0.7133, kg:0.560 },
  '#4':  { d:'D13', area:1.267,  kg:0.994 },
  '#5':  { d:'D16', area:1.986,  kg:1.56  },
  '#6':  { d:'D19', area:2.865,  kg:2.25  },
  '#7':  { d:'D22', area:3.871,  kg:3.04  },
  '#8':  { d:'D25', area:5.067,  kg:3.98  },
  '#9':  { d:'D29', area:6.424,  kg:5.04  },
  '#10': { d:'D32', area:8.143,  kg:6.39  },
  '#11': { d:'D36', area:10.07,  kg:7.91  },
};
function barInfo(name) {
  const mm = REBAR[name], inf = REBAR_INFO[name];
  if (!mm || !inf) return '';
  return `${name}（${inf.d}）⌀${mm.toFixed(2)} mm｜斷面積 ${inf.area} cm²｜${inf.kg} kg/m`;
}

/* ------------------------------------------------------------------ scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(40, (innerWidth-238)/innerHeight, 0.02, 400);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth-238, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position='fixed';
renderer.domElement.style.left='238px';

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 0.15;
controls.maxDistance = 60;
camera.position.set(1.4, 1.1, 1.8);

scene.add(new THREE.HemisphereLight(0xc8ddf2, 0x1b222b, 1.25));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.9);
sun.position.set(4, 7, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.0012;
Object.assign(sun.shadow.camera, { left:-6, right:6, top:6, bottom:-6, near:0.2, far:30 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x9fb4cf, 0.55).translateX(-4).translateY(3));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80),
  new THREE.MeshStandardMaterial({ color:0x343b45, roughness:0.97 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(80, 160, 0x4a5663, 0x2b333c);
grid.position.y = 0.001; grid.material.opacity = 0.5; grid.material.transparent = true; scene.add(grid);

/* -------------------------------------------------------------- materials */
const tex = new THREE.TextureLoader();
const cache = {};
function pbr(name, repeat=[2,2], opts={}) {
  const key = name + repeat.join(',') + JSON.stringify(opts);
  if (cache[key]) return cache[key];
  const base = `textures/${name}/`;
  const L = (f, srgb) => { const t = tex.load(base+f); t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(...repeat); if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  const m = new THREE.MeshStandardMaterial({ map:L('map_1k.jpg',true), normalMap:L('normalMap_1k.jpg'),
    roughnessMap:L('roughnessMap_1k.jpg'), metalness:opts.metalness??0, color:opts.color??0xffffff });
  cache[key] = m; return m;
}
function plainMetal(color, metalness, roughness) {
  const k = 'm'+color+metalness+roughness;
  if (cache[k]) return cache[k];
  cache[k] = new THREE.MeshStandardMaterial({ color, metalness, roughness });
  return cache[k];
}
const MAT = {
  rebar: () => pbr('rusty_metal', [3,3], { metalness:0.85, color:0x9c6f52 }),
  ply:   () => pbr('plywood', [1.6,1.6]),
  timber:() => pbr('plywood', [2.5,1], { color:0xb99a72 }),
  steel: () => plainMetal(0xc2c8ce, 0.92, 0.34),
  galv:  () => plainMetal(0xd2d8de, 0.88, 0.30),
  deck:  () => plainMetal(0xa9b0b7, 0.90, 0.42),
  conc:  () => pbr('brushed_concrete', [1.2,1.2], { color:0xc6c7c2 }),
};

/* -------------------------------------------------------------- geometry */
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const box = (w,h,d,x,y,z) => { const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); return g; };
function cyl(r,len,x,y,z,axis='y'){
  const g=new THREE.CylinderGeometry(r,r,len,10,1,false);
  if(axis==='x') g.rotateZ(Math.PI/2);
  if(axis==='z') g.rotateX(Math.PI/2);
  g.translate(x,y,z); return g;
}
const tube = cyl;   // 別名，鋼筋程式碼用 tube

/* 折彎鋼筋：給一串點，接成圓管（含關節補球） */
function barPolyline(pts, r) {
  const geos = [];
  const up = V(0,1,0);
  for (let i=0;i<pts.length-1;i++) {
    const a = pts[i], b = pts[i+1];
    const d = new THREE.Vector3().subVectors(b, a);
    const len = d.length();
    if (len < 1e-6) continue;
    const g = new THREE.CylinderGeometry(r, r, len, 8, 1, false);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(up, d.clone().normalize()));
    g.translate((a.x+b.x)/2, (a.y+b.y)/2, (a.z+b.z)/2);
    geos.push(g);
  }
  for (const p of pts) { const s = new THREE.SphereGeometry(r*1.02, 8, 6); s.translate(p.x,p.y,p.z); geos.push(s); }
  return mergeGeometries(geos);
}
const P = (x,y,z=0) => V(x,y,z);
/* 135° 彎鉤（在平面內，繞一 corner） */
function hook135(corner, dirIn, dirOut, r, hookLen) {
  const a = corner.clone().addScaledVector(dirIn, hookLen*0.6);
  const b = corner.clone().addScaledVector(dirOut, hookLen);
  return [a, corner, b];
}

/* =============================== 零件定義 =============================== */
const CATS = {};

/* ---------------------------- 鋼筋 -------------------------------------- */
/* ── 鋼筋：參數照配筋圖標註方式（支數-#號、#號@間距、孔徑 D） ───────── */
const BAROPTS = ['#3','#4','#5','#6','#7','#8','#9','#10','#11'];

/* 沿矩形周邊配置 n 支主筋（四角優先，其餘依邊長比例均分） */
function perimeterBars(n, bx, hz) {
  n = Math.max(4, Math.round(n));
  const pts = [[-bx/2,-hz/2],[bx/2,-hz/2],[bx/2,hz/2],[-bx/2,hz/2]];
  const extra = n - 4;
  if (extra <= 0) return pts;
  const sides = [
    { len: bx, from: [-bx/2, hz/2], to: [bx/2, hz/2] },
    { len: bx, from: [bx/2, -hz/2], to: [-bx/2, -hz/2] },
    { len: hz, from: [bx/2, hz/2], to: [bx/2, -hz/2] },
    { len: hz, from: [-bx/2, -hz/2], to: [-bx/2, hz/2] },
  ];
  const total = 2*bx + 2*hz;
  const counts = sides.map(sd => Math.round(extra * sd.len / total));
  let diff = extra - counts.reduce((a,b)=>a+b,0);
  for (let i = 0; diff !== 0 && i < 40; i++) {
    const k = i % 4;
    if (diff > 0) { counts[k]++; diff--; } else if (counts[k] > 0) { counts[k]--; diff++; }
  }
  sides.forEach((sd, i) => {
    const c = counts[i];
    for (let k = 1; k <= c; k++) {
      const t = k / (c + 1);
      pts.push([ sd.from[0] + (sd.to[0]-sd.from[0])*t, sd.from[1] + (sd.to[1]-sd.from[1])*t ]);
    }
  });
  return pts;
}
/* 沿寬度配置 n 支筋（樑上下層） */
function spreadBars(n, width) {
  n = Math.max(2, Math.round(n));
  const out = [];
  for (let i = 0; i < n; i++) out.push(-width/2 + width * (i + 0.5) / n);
  return out;
}

/* ── 續接器（機械式續接）─────────────────────────────────────────────
   依 RC10：套筒長約 3.5db、外徑約 1.8db，兩端車牙對接；
   續接器中心距 ≥3db（圍束鋼筋圍束處可 2.5db），錯接 ≥60cm；
   淨保護層 ≥2db（圍束處 1.5db）。                                          */
function couplerGeo(db, y, x, z) {
  const L = 3.5 * db, R = 0.9 * db;
  const gs = [];
  gs.push(tube(R, L, x, y, z));                    // 套筒本體
  gs.push(tube(R * 1.12, L * 0.22, x, y - L * 0.5, z));  // 上下端加厚（螺牙段）
  gs.push(tube(R * 1.12, L * 0.22, x, y + L * 0.5, z));
  return gs;
}

const SPLICE_OPTS = ['續接器', '搭接'];

/* RC10 表1 機械式續接性能合格標準（第 1~3 類 = B / A / SA 級） */
const COUPLER_GRADE = {
  'SA級': { cls:'第三類', tensile:'≥1.25fy 且 ≥fu', slip1c:'≤0.3 mm',
            elong:'D32以下 ≥9%、D36以上 ≥6%', repeat:'不適用',
            cyclic:'≥1.25fy 且 ≥fu；δs16c≤0.3、δs24c≤0.9、δs32c≤1.8 mm',
            sample:'單向拉伸 1/100、高塑性反覆載 1/1000', color:0x8f9aa6 },
  'A級':  { cls:'第二類', tensile:'≥1.25fy 且 ≥fu', slip1c:'≤0.3 mm',
            elong:'≥4%', repeat:'不適用',
            cyclic:'≥1.25fy 且 ≥fu；δs16c≤0.3、δs24c≤0.9 mm',
            sample:'單向拉伸 1/100、高塑性反覆載 1/1000', color:0xa6b0bb },
  'B級':  { cls:'第一類', tensile:'≥1.25fy', slip1c:'≤0.3 mm',
            elong:'≥2%', repeat:'≥1.25fy；滑動量 ≤0.3 mm；伸長率 ≥2%',
            cyclic:'不適用',
            sample:'單向拉伸 1/100、重複載及滑動 1/1000', color:0xc2c9d0 },
};
/* 依鋼筋等級換算 1.25fy（kgf/cm²） */
const STEEL_FY = { SD280: 2800, SD420: 4200, SD490: 4900, SD550: 5500 };
function couplerSpec(p) {
  const g = COUPLER_GRADE[p.grade] || COUPLER_GRADE['A級'];
  const fy = STEEL_FY[p.fy] || 4200;
  const need = Math.round(1.25 * fy);
  const big = p.bar === '#7' || p.bar === '#8';
  return { g, need, big };
}

function buildColBody(p, gs, opts = {}) {
  const cov = p.cover, db = REBAR[p.main] / 1000, ds = REBAR[p.tie] / 1000;
  const bx = p.b - cov * 2, hz = p.h - cov * 2, H = p.Hn;
  const pts = perimeterBars(p.nMain, bx, hz);

  if (p.splice === '續接器') {
    // 兩段鋼筋 + 套筒；相鄰鋼筋錯接 ≥60cm
    const base = H / 2;
    const stagger = Math.max(0.6, 3 * db);
    pts.forEach(([x, z], i) => {
      const ySplice = base + (i % 2 ? stagger / 2 : -stagger / 2);
      const lo = ySplice, up = H + 0.6 - ySplice;
      gs.push(tube(db / 2, lo, x, lo / 2, z));                       // 下段
      gs.push(tube(db / 2, up, x, ySplice + up / 2, z));             // 上段
      gs.push(...couplerGeo(db, ySplice, x, z));                     // 續接器
    });
  } else {
    // 搭接：上端預留 0.6 m 重疊段
    for (const [x, z] of pts) gs.push(tube(db / 2, H + 0.6, x, (H + 0.6) / 2, z));
  }
  return pts;
}

CATS['續接'] = [
  { id:'coupler', name:'鋼筋續接器（單一接頭）', unit:'RC10', note:'套筒長 3.5db、外徑 1.8db；兩端車牙對接；中心距 ≥3db、錯接 ≥60cm、淨保護層 ≥2db',
    p:{ bar:{label:'鋼筋號數',opts:BAROPTS,def:'#7'},
        fy:{label:'鋼筋等級',opts:['SD280','SD420','SD490','SD550'],def:'SD420'},
        grade:{label:'續接器等級',opts:['SA級','A級','B級'],def:'SA級'},
        gap:{label:'錯接距離 (m)',min:0,max:1.2,step:0.1,def:0.6} },
    build:p => {
      const db = REBAR[p.bar]/1000, gs=[];
      const { g, need, big } = couplerSpec(p);
      p.__color = g.color;
      p.__spec = `${barInfo(p.bar)}　▸ ${g.cls}｜抗拉 ${g.tensile}（1.25fy = ${need} kgf/cm²）｜伸長率 ${g.elong}｜取樣 ${g.sample}`;
      // 垂直鋼筋：下段 + 套筒 + 上段（續接器在 y=0）
      gs.push(tube(db/2, 1.2, 0, -0.6, 0));
      gs.push(tube(db/2, 1.2, 0,  0.6, 0));
      gs.push(...couplerGeo(db, 0, 0, 0));
      gs.push(tube(db/2, 1.2, 0.35, p.gap - 0.6, 0));
      gs.push(tube(db/2, 1.2, 0.35, p.gap + 0.6, 0));
      gs.push(...couplerGeo(db, p.gap, 0.35, 0));
      return mergeGeometries(gs);
    } },

  { id:'coupler-sect', name:'續接器剖面（錯接示意）', unit:'RC10', note:'同一斷面隔根續接，相鄰續接器中心距 ≥3db；錯接 ≥60cm',
    p:{ bar:{label:'鋼筋號數',opts:BAROPTS,def:'#7'},
        fy:{label:'鋼筋等級',opts:['SD280','SD420','SD490','SD550'],def:'SD420'},
        grade:{label:'續接器等級',opts:['SA級','A級','B級'],def:'SA級'},
        n:{label:'每排支數',min:2,max:6,step:1,def:4} },
    build:p => {
      const db = REBAR[p.bar]/1000, gs=[];
      const { g, need } = couplerSpec(p);
      p.__color = g.color;
      p.__spec = `${g.cls}｜中心距 ≥3db（圍束處 2.5db）｜1.25fy = ${need} kgf/cm²`;
      const step = 0.25;
      for (let i=0;i<p.n;i++) {
        const z = -step*(p.n-1)/2 + i*step;
        const yc = (i % 2) ? 0.3 : -0.3;                   // 隔根錯接
        gs.push(tube(db/2, 2.0, 0, yc, z));                // 整支（視覺上連續）
        gs.push(...couplerGeo(db, yc, 0, z));              // 續接器位置錯開
      }
      return mergeGeometries(gs);
    } },

  { id:'headed', name:'擴頭鋼筋', unit:'RC10', note:'端部擴頭，可替代 90° 彎鉤；淨保護層 ≥2db、中心距 ≥3db',
    p:{ bar:{label:'鋼筋號數',opts:BAROPTS,def:'#7'},
        len:{label:'長度 (m)',min:0.5,max:3,step:0.1,def:1.2} },
    build:p => {
      const db = REBAR[p.bar]/1000, gs=[];
      gs.push(tube(db/2, p.len, 0, p.len/2, 0));
      const head = new THREE.CylinderGeometry(1.9*db, 1.9*db, 0.6*db, 12);
      head.translate(0, p.len + 0.3*db, 0); gs.push(head);
      return mergeGeometries(gs);
    } },
];

CATS['鋼筋'] = [
  /* ── 柱配筋（RC06） 標註例：主筋 12-#7、箍筋 #3@10/15、保護層 4cm ── */
  { id:'colrebar', name:'柱配筋（整組）', unit:'RC06', note:'主筋 12-#7 型式；圍束區 Lo=max(Hn/6,最大斷面,45cm) 箍筋@10；中央區@15；135°鉤',
    p:{ b:{label:'柱寬 b (m)',min:0.3,max:1.4,step:0.05,def:0.6},
        h:{label:'柱深 h (m)',min:0.3,max:1.4,step:0.05,def:0.6},
        Hn:{label:'柱淨高 Hn (m)',min:1.5,max:5,step:0.1,def:3.0},
        nMain:{label:'主筋支數',min:4,max:20,step:2,def:12},
        main:{label:'主筋號數',opts:BAROPTS,def:'#7'},
        tie:{label:'箍筋號數',opts:['#3','#4'],def:'#3'},
        s1:{label:'圍束區 @ (cm)',min:7.5,max:15,step:2.5,def:12.5},
        s2:{label:'中央區 @ (cm)',min:10,max:20,step:2.5,def:15},
        splice:{label:'續接方式',opts:['續接器','搭接'],def:'續接器'},
        cover:{label:'保護層 (m)',min:0.03,max:0.06,step:0.005,def:0.04} },
    build:p => {
      const cov=p.cover, db=REBAR[p.main]/1000, ds=REBAR[p.tie]/1000;
      const bx=p.b-cov*2, hz=p.h-cov*2, H=p.Hn;
      const gs=[];
      p.__spec = `主筋 ${p.nMain}-${p.main}：${barInfo(p.main)}｜箍筋 ${p.tie}：${barInfo(p.tie)}`;
      buildColBody(p, gs);          // 主筋 + 續接器/搭接
      const Lo = Math.min(Math.max(H/6, Math.max(p.b,p.h), 0.45), H/2);
      const S1 = p.s1/100, S2 = p.s2/100;
      const ys=[];
      for (let y=S1; y<=Lo+1e-6; y+=S1) ys.push(y);
      for (let y=H-Lo; y<H-1e-6; y+=S1) ys.push(y);
      for (let y=Lo+S2; y<H-Lo-1e-6; y+=S2) ys.push(y);
      const a=bx/2, b2=hz/2, hook=Math.max(6*ds,0.06);
      for (const y of ys.sort((q,w)=>q-w)) {
        gs.push(barPolyline([
          P( a, y, -b2), P( a, y,  b2), P(-a, y,  b2), P(-a, y, -b2), P( a, y, -b2),
          P( a, y + hook, -b2 + hook), P( a - hook*0.7, y + hook*0.7, -b2 + hook*0.7)
        ], ds/2));
      }
      for (let y=S2*2; y<H; y+=S2*4) {
        if (bx > 0.30) gs.push(barPolyline([ P(-a+0.01, y, 0), P(a-0.01, y, 0) ], ds/2*0.9));
        if (hz > 0.30) gs.push(barPolyline([ P(0, y, -b2+0.01), P(0, y, b2-0.01) ], ds/2*0.9));
      }
      return mergeGeometries(gs);
    } },

  /* ── 樑配筋（RC04） 標註例：上層 4-#7、下層 3-#7、箍筋 #3@10/15 ── */
  { id:'beamrebar', name:'樑配筋（整組）', unit:'RC04', note:'上層≥2支通達支承並 90° 錨定；端部 2h 內 S1；中央 S2；樑深≥60cm 加腰筋',
    p:{ bw:{label:'樑寬 (m)',min:0.25,max:0.9,step:0.05,def:0.4},
        h:{label:'樑深 (m)',min:0.4,max:1.3,step:0.05,def:0.7},
        Ln:{label:'淨跨 (m)',min:2,max:10,step:0.5,def:6},
        nTop:{label:'上層支數',min:2,max:8,step:1,def:4},
        nBot:{label:'下層支數',min:2,max:8,step:1,def:3},
        main:{label:'主筋號數',opts:BAROPTS,def:'#7'},
        tie:{label:'箍筋號數',opts:['#3','#4'],def:'#3'},
        s1:{label:'端部 S1 @ (cm)',min:7.5,max:15,step:2.5,def:10},
        s2:{label:'中央 S2 @ (cm)',min:10,max:25,step:2.5,def:15},
        web:{label:'腰筋',opts:['自動','無'],def:'自動'},
        cover:{label:'保護層 (m)',min:0.03,max:0.06,step:0.005,def:0.04} },
    build:p => {
      const cov=p.cover, db=REBAR[p.main]/1000, ds=REBAR[p.tie]/1000;
      const bw=p.bw-cov*2, L=p.Ln, hL=L/2;
      const yTop = p.h - cov - db/2, yBot = cov + db/2;
      const gs=[];
      p.__spec = `上層 ${p.nTop}-${p.main}、下層 ${p.nBot}-${p.main}：${barInfo(p.main)}｜箍筋 ${p.tie}：${barInfo(p.tie)}`;
      for (const z of spreadBars(p.nTop, bw))
        gs.push(barPolyline([ P(-hL-0.35, yTop+0.35, z), P(-hL-0.35, yTop, z), P(hL+0.35, yTop, z), P(hL+0.35, yTop+0.35, z) ], db/2));
      for (const z of spreadBars(p.nBot, bw))
        gs.push(barPolyline([ P(-hL-0.2, yBot, z), P(hL+0.2, yBot, z) ], db/2));
      if (p.web === '自動' && p.h >= 0.6) {
        for (const z of [-bw/2, bw/2])
          gs.push(barPolyline([ P(-hL, p.h*0.5, z), P(hL, p.h*0.5, z) ], REBAR['#4']/2000));
      }
      const S1 = p.s1/100, S2 = p.s2/100, zone = 2*p.h;
      const a=bw/2, yc=(yTop+yBot)/2, bh=(yTop-yBot)/2, hook=Math.max(6*ds,0.06);
      const xs=[];
      for (let x=-hL+S1; x<=-hL+zone; x+=S1) xs.push(x);
      for (let x=hL-zone; x<=hL-S1+1e-6; x+=S1) xs.push(x);
      for (let x=-hL+zone+S2; x<hL-zone-1e-6; x+=S2) xs.push(x);
      for (const x of xs.sort((q,w)=>q-w)) {
        gs.push(barPolyline([
          P(x, yc-bh, -a), P(x, yc+bh, -a), P(x, yc+bh, a), P(x, yc-bh, a), P(x, yc-bh, -a),
          P(x, yc-bh+hook, -a), P(x, yc-bh+hook*0.7, -a+hook*0.7)
        ], ds/2));
      }
      return mergeGeometries(gs);
    } },

  /* ── 板配筋（RC07/RC08） 標註例：下層 #4@15、上層 #4@15（支承處 0.25L）── */
  { id:'slabrebar', name:'板配筋（整組）', unit:'RC07/RC08', note:'下層雙向@15；上層筋支承處延伸 0.25L；錨定 Ld、支承≥15cm；保護層 2cm',

      const ext = p.extRatio * Math.min(L,W);

      for (let x=-L/2+cov; x<=L/2-cov+1e-6; x+=sb) gs.push(tube(r, W-2*cov, x, yBot, 0, 'z'));

  /* ── 樑穿孔補強（RC05）孔徑分級 ── */
  { id:'beamhole', name:'樑穿孔補強', unit:'RC05', note:'D≤h/10 不補強；≤10cm 2-D10；≤20cm 2-D13；≤h/3 2-D16；距柱面 1 倍樑深內不得穿孔',

        D:{label:'孔徑 D (cm)',min:3,max:30,step:1,def:15},

    build:p => {
      const cov=0.04, bw=p.bw-cov*2, L=p.Ln, hL=L/2;
      const D=p.D/100;
      const gs=[];
      const yc = p.h/2;
      const xc = -hL + p.pos*p.h;
      for (const y of [cov+0.011, p.h-cov-0.011]) gs.push(tube(0.011, L, 0, y, 0, 'x'));
      const ring = new THREE.TorusGeometry(D/2, 0.006, 6, 24);
      ring.rotateY(Math.PI/2); ring.translate(xc, yc, 0); gs.push(ring);
      const grade = p.D <= p.h*100/10 ? 0 : (p.D <= 10 ? 1 : (p.D <= 20 ? 2 : 3));
      const rSup = [0, REBAR['#3'], REBAR['#4'], REBAR['#5']][grade] / 2000;
      if (grade > 0) {
        const extLen = 12 * (rSup*2);
        for (const dy of [D/2 + 0.05, -(D/2 + 0.05)])
          for (const dz of [-bw*0.25, bw*0.25])
            gs.push(tube(rSup, D + 2*extLen, xc, yc + dy, dz, 'x'));
        for (const s of [1,-1])
          for (const dz of [-bw*0.25, bw*0.25]) {
            const len = Math.hypot(D*0.8, D*0.8) + extLen;
            const g = new THREE.CylinderGeometry(rSup, rSup, len, 8);
            g.rotateZ(s * Math.PI/4); g.translate(xc, yc, dz);
            gs.push(g);
          }
      }
      return mergeGeometries(gs);
    } },

  { id:'slabopen', name:'樓板開口補強', unit:'RC07', note:'開口四周加補強筋，斷面積 ≥ 被截斷筋量；孔洞四角另加斜筋',
    p:{ L:{label:'版長 (m)',min:2,max:8,step:0.5,def:4},

  { id:'bar', name:'直筋', unit:'單支', note:'CNS 560，定尺 9 m / 12 m',

/* ── 樓層組合：柱筋 + 樑筋 + 板筋 + 接頭區箍筋 ─────────────────────── */
CATS['樓層'] = [
  { id:'floor', name:'一層樓鋼筋（組合）', unit:'柱+樑+板', note:'柱筋升出樓板、樑筋穿入柱、板上層筋支承處延伸；樑柱接頭箍筋加密',
    p:{ bayX:{label:'柱間距 X (m)',min:3,max:9,step:0.5,def:6},
        bayZ:{label:'柱間距 Z (m)',min:3,max:9,step:0.5,def:6},
        Hn:{label:'樓高 (m)',min:2.5,max:4.5,step:0.1,def:3.2},
        cb:{label:'柱寬 (m)',min:0.3,max:0.9,step:0.05,def:0.5},
        bb:{label:'樑寬 (m)',min:0.25,max:0.6,step:0.05,def:0.4},
        bh:{label:'樑深 (m)',min:0.4,max:0.9,step:0.05,def:0.6},
        t:{label:'版厚 (m)',min:0.1,max:0.25,step:0.01,def:0.15} },
    build:p => {
      const gs=[];
      const {bayX, bayZ, Hn, cb, bb, bh} = p;
      const db = REBAR['#7']/1000, ds = REBAR['#3']/1000, cov = 0.04;
      for (const sx of [-1,1]) for (const sz of [-1,1]) {
        const cx = sx*bayX/2, cz = sz*bayZ/2;
        const bx = cb-cov*2, hz = cb-cov*2, a=bx/2, b2=hz/2;
        const cpts = perimeterBars(8, bx, hz);
        cpts.forEach(([dx,dz], i) => {
          const yS = Hn/2 + (i % 2 ? 0.3 : -0.3);
          gs.push(tube(db/2, yS, cx+dx, yS/2, cz+dz));
          gs.push(tube(db/2, Hn+0.6-yS, cx+dx, yS + (Hn+0.6-yS)/2, cz+dz));
          gs.push(...couplerGeo(db, yS, cx+dx, cz+dz));
        });
        const Lo = Math.min(Math.max(Hn/6, cb, 0.45), Hn/2);
        const ys=[];
        for (let y=0.1; y<=Lo; y+=0.10) ys.push(y);
        for (let y=Hn-Lo; y<Hn; y+=0.10) ys.push(y);
        for (let y=Lo+0.15; y<Hn-Lo; y+=0.15) ys.push(y);
        for (const y of ys) {
          gs.push(barPolyline([
            P(cx+a, y, cz-b2), P(cx+a, y, cz+b2), P(cx-a, y, cz+b2), P(cx-a, y, cz-b2), P(cx+a, y, cz-b2)
          ], ds/2));
        }
      }
      const yTop = Hn - cov - db/2, yBot = Hn - bh + cov + db/2;
      for (const sz of [-1,1]) {
        const cz = sz*bayZ/2;
        for (const dz of [-bb/2+cov, bb/2-cov]) {
          gs.push(tube(db/2, bayX+cb, 0, yTop, cz+dz, 'x'));
          gs.push(tube(db/2, bayX+cb, 0, yBot, cz+dz, 'x'));
        }
      }
      for (const sx of [-1,1]) {
        const cx = sx*bayX/2;
        for (const dx of [-bb/2+cov, bb/2-cov]) {
          gs.push(tube(db/2, bayZ+cb, cx+dx, yTop, 0, 'z'));
          gs.push(tube(db/2, bayZ+cb, cx+dx, yBot, 0, 'z'));
        }
      }
      const yb = Hn + cov + db/2;
      for (let z=-bayZ/2+cov; z<=bayZ/2-cov; z+=0.20) gs.push(tube(db/3, bayX-cb, 0, yb, z, 'x'));
      for (let x=-bayX/2+cov; x<=bayX/2-cov; x+=0.20) gs.push(tube(db/3, bayZ-cb, x, yb, 0, 'z'));
      return mergeGeometries(gs);
    } },
];

    p:{ len:{label:'長度 (m)',min:0.2,max:1.5,step:0.05,def:0.6} },
    build:p => { const R=0.0055;
      return mergeGeometries([
        cyl(R, p.len, 0, 0, 0, 'x'),
        cyl(0.012, 0.03, -p.len/2+0.015, 0, 0, 'x'),
        cyl(0.012, 0.03,  p.len/2-0.015, 0, 0, 'x'),

        box(0.09, 0.09, 0.008,  p.len/2-0.05, 0, 0),

  { id:'beamclamp', name:'樑箍（雙鋼管）', unit:'樑模板', note:'樑側雙鋼管 + 對拉螺栓，每 45 cm 一道',
    p:{ w:{label:'樑寬 (m)',min:0.2,max:0.8,step:0.05,def:0.4},

    build:p => { const R=TW.clampTube/2, span=p.w/2+0.09;
      const gs=[];
      for (const s of [-1,1]) gs.push(cyl(R, span*2, 0, s*p.h*0.35, 0, 'z'));
      gs.push(cyl(0.006, span*2+0.1, 0, p.h*0.35, 0, 'z'));
      return mergeGeometries(gs); } },

  { id:'sole', name:'柱腳固定（壓腳）', unit:'柱模底部', note:'柱模底部以角材＋釘固定於樓板，防止跑模',
    p:{ a:{label:'柱寬 (m)',min:0.2,max:1.2,step:0.05,def:0.4} },
    build:p => { const s=TW.batten, w=p.a+0.2;
      const gs=[];
      for (const sz of [-1,1]) gs.push(box(w, s, s, 0, s/2, sz*(p.a/2+0.06)));

/* ---------------------------- 施工架 ------------------------------------ */
CATS['施工架'] = [
  { id:'frame', name:'門型架（一榀）', unit:'主架', note:'1.83 m 寬 × 1.90 m 高，φ48.6 鋼管，含框內交叉斜撐',
    p:{ w:{label:'寬 (m)',min:1.0,max:2.0,step:0.05,def:1.83},
        h:{label:'高 (m)',min:1.2,max:2.2,step:0.05,def:1.90} },
    build:p => { const R=TW.tube/2, W=p.w, H=p.h, gs=[];
      for (const x of [-W/2, W/2]) {
        gs.push(cyl(R, H, x, H/2, 0));
        gs.push(box(0.14,0.012,0.14, x, 0.006, 0));
        gs.push(cyl(R*0.62, 0.09, x, 0.10, 0));
      }
      gs.push(cyl(R*0.45, W, 0, 0.14, 0, 'x'));
      gs.push(cyl(R*0.45, W, 0, H-0.14, 0, 'x'));
      const len=Math.hypot(W, H-0.28), ang=Math.atan2(H-0.28, W);
      for (const s of [1,-1]) {
        const g=new THREE.CylinderGeometry(R*0.34,R*0.34,len,8);
        g.rotateZ(Math.PI/2 - ang*s); g.translate(0, H/2, 0); gs.push(g);

      return mergeGeometries(gs); } },

  { id:'cross', name:'交叉拉桿', unit:'架間', note:'每跨每層一組，內外側都要裝；端立架及轉角處必裝',
    p:{ w:{label:'跨距 (m)',min:1.0,max:2.0,step:0.05,def:1.83},
        h:{label:'層高 (m)',min:1.2,max:2.2,step:0.05,def:1.90} },
    build:p => { const R=TW.tube*0.4;
      const len=Math.hypot(p.w,p.h), ang=Math.atan2(p.h,p.w);
      const gs=[];
      for (const s of [1,-1]) {
        const g=new THREE.CylinderGeometry(R,R,len,8);
        g.rotateZ(Math.PI/2 - ang*s); g.translate(0,0,0); gs.push(g);
      }
      return mergeGeometries(gs); } },

  { id:'plank', name:'沖孔踏板', unit:'工作台', note:'金屬沖孔板，兩端扣鎖；板間縫隙須 < 3 cm',
    p:{ len:{label:'長 (m)',min:0.5,max:2.0,step:0.05,def:1.83},

        gs.push(box(0.04, 0.09, 0.04, s*(p.len/2-0.03), 0.045, -p.w/2+0.02));
      }
      return mergeGeometries(gs); } },

  { id:'post', name:'護欄立柱', unit:'護欄', note:'φ33 鋼管立柱，插在踏板端或立桿上',
    p:{ h:{label:'高 (m)',min:0.6,max:1.2,step:0.05,def:0.95} },
    build:p => cyl(TW.rail/2, p.h, 0, p.h/2, 0) },

  { id:'rail', name:'欄杆（上/中）', unit:'護欄', note:'上欄杆 90 cm、中欄杆 45 cm，φ33 鋼管',
    p:{ len:{label:'長 (m)',min:0.5,max:6,step:0.1,def:1.83},
        which:{label:'位置',opts:['上欄杆','中欄杆'],def:'上欄杆'} },
    build:p => cyl(TW.rail/2, p.len, 0, 0, 0, 'x') },

  { id:'toe', name:'踢腳板 18 cm', unit:'護欄', note:'高度 18 cm，防止工具材料掉落',
    p:{ len:{label:'長 (m)',min:0.5,max:6,step:0.1,def:1.83} },
    build:p => box(p.len, TW.toe, 0.012, 0, TW.toe/2, 0) },

  { id:'basejack', name:'可調基腳座板', unit:'施工架底部', note:'調整高度、分散載重；基礎須平整夯實',
    p:{ h:{label:'調整高 (m)',min:0.05,max:0.5,step:0.01,def:0.2} },
    build:p => mergeGeometries([
      box(0.15,0.012,0.15, 0,0.006,0),
      cyl(TW.tube/2, p.h, 0, p.h/2+0.01, 0),
      cyl(TW.tube*0.62, 0.06, 0, p.h*0.55, 0),
    ]) },

  { id:'walltie', name:'壁連座（繫牆桿）', unit:'與構造物連結', note:'縱向 5.5 m、橫向 4.5 m 一道，須鎖在結構體上',
    p:{ len:{label:'長 (m)',min:0.5,max:2,step:0.05,def:1.3} },
    build:p => mergeGeometries([
      cyl(TW.tube/2, p.len, 0, 0, -p.len/2, 'z'),
      box(0.10,0.10,0.012, 0, 0, -p.len),
      box(0.05,0.05,0.05, 0, 0, 0),
    ]) },
];

/* ---------------------------- 支撐 -------------------------------------- */
CATS['支撐'] = [
  { id:'prop', name:'可調鋼管支柱（烏龜）', unit:'CNS 5644', note:'φ48.6×2.3 mm，常用 2.1–3.6 m；底板+調整螺帽+U 型托座',

      box(0.05,0.008,0.10, 0, p.h+0.012, 0),

  { id:'mainjoist', name:'大樑母索', unit:'模板支撐頂部', note:'90×90 角材，沿主樑方向放在支柱 U 型托座上',

  { id:'subjoist', name:'小樑母索', unit:'模板支撐頂部', note:'38×90 角材，垂直大樑母索，間距約 30 cm',
    p:{ len:{label:'長 (m)',min:0.6,max:4,step:0.1,def:1.6} },
    build:p => box(p.len, 0.09, 0.038, 0, 0.045, 0) },

  { id:'tiebar', name:'水平繫條', unit:'§23 規定', note:'支柱高 > 3.5 m 時每 2 m 設縱橫水平繫條',
    p:{ len:{label:'長 (m)',min:0.6,max:4,step:0.1,def:2.4} },

  { id:'diag', name:'交叉斜撐', unit:'§23 規定', note:'最上層及每 5 層以內設置，X 型交叉',
    p:{ w:{label:'跨 (m)',min:0.6,max:4,step:0.1,def:2.4},

      const len=Math.hypot(p.w,p.h), ang=Math.atan2(p.h,p.w);

/* ---------------------------- 混凝土 ------------------------------------ */
CATS['混凝土'] = [
  { id:'col', name:'柱', unit:'CNS 3090', note:'斷面與強度依設計；常用 210/280/350 kgf/cm²',
    p:{ a:{label:'寬 (m)',min:0.2,max:1.2,step:0.05,def:0.4},
        b:{label:'深 (m)',min:0.2,max:1.2,step:0.05,def:0.4},

    build:p => box(p.a, p.h, p.b, 0, p.h/2, 0) },
  { id:'beam', name:'樑', unit:'CNS 3090', note:'樑深含版厚',
    p:{ L:{label:'長 (m)',min:1,max:12,step:0.5,def:6},
        bw:{label:'寬 (m)',min:0.2,max:0.8,step:0.05,def:0.4},
        bh:{label:'深 (m)',min:0.3,max:1.2,step:0.05,def:0.7} },

        h:{label:'高 (m)',min:0.6,max:5,step:0.1,def:2.8},

function TWW(v){ return v; }   // 佔位：讓上面的預設值可讀

/* ------------------------------------------------------------------ UI */
const state = { cat:'鋼筋', part:'bar', vals:{} };
const group = new THREE.Group();
scene.add(group);

function partDef(cat, id) { return (CATS[cat]||[]).find(x=>x.id===id); }
function valsFor(key, def) {
  if (state.vals[key]) return state.vals[key];
  const v = {};
  for (const [k,s] of Object.entries(def.p)) v[k] = s.def;
  state.vals[key] = v;
  return v;
}

function buildCats() {
  const wrap = document.getElementById('cats');
  wrap.innerHTML = '';
  Object.keys(CATS).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.className = (c === state.cat ? 'on' : '');
    b.onclick = () => {
      state.cat = c;
      state.part = CATS[c][0].id;
      buildCats(); buildList(); buildParams(); rebuild();
    };
    wrap.appendChild(b);
  });
}

function buildList() {
  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  CATS[state.cat].forEach(d => {
    const el = document.createElement('div');
    el.className = 'item' + (d.id === state.part ? ' on' : '');
    el.innerHTML = `<span>${d.name}</span><i>${d.unit}</i>`;
    el.onclick = () => { state.part = d.id; buildList(); buildParams(); rebuild(); };
    wrap.appendChild(el);
  });
}

function buildParams() {
  const def = partDef(state.cat, state.part);
  const key = state.cat + '/' + state.part;
  const vals = valsFor(key, def);
  const wrap = document.getElementById('params');
  wrap.innerHTML = '';
  document.getElementById('title').textContent = def.name;
  document.getElementById('desc').textContent = def.unit;
  document.getElementById('spec').textContent = def.note || '';

  for (const [k, s] of Object.entries(def.p)) {
    const row = document.createElement('div');
    row.className = 'p';
    if (s.opts) {
      row.innerHTML = `<label>${s.label}</label><div class="row"></div>`;
      const r = row.querySelector('.row');
      s.opts.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o;
        b.className = (String(vals[k]) === String(o) ? 'on' : '');
        b.onclick = () => { vals[k] = o; buildParams(); rebuild(); };
        r.appendChild(b);
      });
    } else {
      row.innerHTML = `<label>${s.label}<b>${vals[k]}</b></label>
        <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${vals[k]}">`;
      row.querySelector('input').oninput = (e) => {
        vals[k] = +e.target.value;
        row.querySelector('b').textContent = vals[k];
        rebuild();
      };
    }
    wrap.appendChild(row);
  }
}

function rebuild() {
  const def = partDef(state.cat, state.part);
  const key = state.cat + '/' + state.part;
  const vals = state.vals[key];
  while (group.children.length) {
    const c = group.children.pop();
    c.geometry?.dispose();
  }
  vals.__spec = ''; vals.__color = 0;
  let geo;
  try { geo = def.build(vals); } catch (e) { console.error(e); return; }
  if (!geo) return;
  document.getElementById('spec').textContent =
    (def.note || '') + (vals.__spec ? '　▸ ' + vals.__spec : '');
  const mat = vals.__color ? plainMetal(vals.__color, 0.9, 0.35)
            : state.cat === '鋼筋' ? MAT.rebar()
            : state.cat === '模板' ? (def.id === 'ply' ? MAT.ply()
              : def.id === 'batten' || def.id === 'sole' ? MAT.timber()
              : def.id === 'plank' || def.id === 'toe' ? MAT.galv() : MAT.steel())
            : state.cat === '施工架' ? (def.id === 'plank' ? MAT.deck() : MAT.galv())
            : state.cat === '支撐' ? (def.id.includes('joist') ? MAT.timber() : MAT.steel())
            : MAT.conc();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  const n = geo.index ? geo.index.count : geo.attributes.position.count;
  document.getElementById('stat').textContent =
    `${Math.round(n/3).toLocaleString()} 三角形 · 拖曳旋轉 · 滾輪縮放`;
  fitView();
}

function fitView() {
  const bb = new THREE.Box3().setFromObject(group);
  if (bb.isEmpty()) return;
  const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.y, s.z) * 1.5;
  controls.target.copy(c);
  camera.position.set(c.x + d*0.66, c.y + d*0.5, c.z + d*0.8);
  controls.update();
}

buildCats(); buildList(); buildParams(); rebuild();
window.__ready = true;
window.__dbg = { state, rebuild, CATS };

addEventListener('resize', () => {
  const w = innerWidth - 238;
  camera.aspect = w / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(w, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
