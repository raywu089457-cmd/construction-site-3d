  <h2>分類</h2>

  <h2>零件</h2>
  <div id="list"></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* 台灣規範：CNS 560 竹節鋼筋、CNS 5644 可調鋼管支柱、CNS 3090 混凝土
   營造安全衛生設施標準 §23 模板支撐、§39 施工架                       */
const TW = {
  ply:0.018, panelW:1.219, panelH:2.438, batten:0.038,
  tube:0.0486, rail:0.033, clampTube:0.0486,
  frameW:1.83, frameH:1.90, toe:0.18, railTop:0.90, railMid:0.45,
};
const REBAR = { '#3':10, '#4':13, '#5':16, '#6':19, '#7':22, '#8':25 };

/* ------------------------------------------------------------------ scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(40, (innerWidth-238)/innerHeight, 0.02, 400);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth-238, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position='fixed';
renderer.domElement.style.left='238px';

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 0.15;
controls.maxDistance = 60;
camera.position.set(1.4, 1.1, 1.8);

scene.add(new THREE.HemisphereLight(0xc8ddf2, 0x1b222b, 1.25));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.9);
sun.position.set(4, 7, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.0012;
Object.assign(sun.shadow.camera, { left:-6, right:6, top:6, bottom:-6, near:0.2, far:30 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x9fb4cf, 0.55).translateX(-4).translateY(3));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80),
  new THREE.MeshStandardMaterial({ color:0x343b45, roughness:0.97 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(80, 160, 0x4a5663, 0x2b333c);
grid.position.y = 0.001; grid.material.opacity = 0.5; grid.material.transparent = true; scene.add(grid);

/* -------------------------------------------------------------- materials */
const tex = new THREE.TextureLoader();
const cache = {};
function pbr(name, repeat=[2,2], opts={}) {
  const key = name + repeat.join(',') + JSON.stringify(opts);
  if (cache[key]) return cache[key];
  const base = `textures/${name}/`;
  const L = (f, srgb) => { const t = tex.load(base+f); t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(...repeat); if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  const m = new THREE.MeshStandardMaterial({ map:L('map_1k.jpg',true), normalMap:L('normalMap_1k.jpg'),
    roughnessMap:L('roughnessMap_1k.jpg'), metalness:opts.metalness??0, color:opts.color??0xffffff });
  cache[key] = m; return m;
}
function plainMetal(color, metalness, roughness) {
  const k = 'm'+color+metalness+roughness;
  if (cache[k]) return cache[k];
  cache[k] = new THREE.MeshStandardMaterial({ color, metalness, roughness });
  return cache[k];
}
const MAT = {
  rebar: () => pbr('rusty_metal', [3,3], { metalness:0.85, color:0x9c6f52 }),
  ply:   () => pbr('plywood', [1.6,1.6]),
  timber:() => pbr('plywood', [2.5,1], { color:0xb99a72 }),
  steel: () => plainMetal(0xc2c8ce, 0.92, 0.34),
  galv:  () => plainMetal(0xd2d8de, 0.88, 0.30),
  deck:  () => plainMetal(0xa9b0b7, 0.90, 0.42),
  conc:  () => pbr('brushed_concrete', [1.2,1.2], { color:0xc6c7c2 }),
};

/* -------------------------------------------------------------- geometry */
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const box = (w,h,d,x,y,z) => { const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); return g; };
function cyl(r,len,x,y,z,axis='y'){
  const g=new THREE.CylinderGeometry(r,r,len,10,1,false);
  if(axis==='x') g.rotateZ(Math.PI/2);
  if(axis==='z') g.rotateX(Math.PI/2);
  g.translate(x,y,z); return g;
}
/* 折彎鋼筋：給一串點，接成圓管（含關節補球） */
function barPolyline(pts, r) {
  const geos = [];
  const up = V(0,1,0);
  for (let i=0;i<pts.length-1;i++) {
    const a = pts[i], b = pts[i+1];
    const d = new THREE.Vector3().subVectors(b, a);
    const len = d.length();
    if (len < 1e-6) continue;
    const g = new THREE.CylinderGeometry(r, r, len, 8, 1, false);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(up, d.clone().normalize()));
    g.translate((a.x+b.x)/2, (a.y+b.y)/2, (a.z+b.z)/2);
    geos.push(g);
  }
  for (const p of pts) { const s = new THREE.SphereGeometry(r*1.02, 8, 6); s.translate(p.x,p.y,p.z); geos.push(s); }
  return mergeGeometries(geos);
}
const P = (x,y,z=0) => V(x,y,z);
/* 135° 彎鉤（在平面內，繞一 corner） */
function hook135(corner, dirIn, dirOut, r, hookLen) {
  const a = corner.clone().addScaledVector(dirIn, hookLen*0.6);
  const b = corner.clone().addScaledVector(dirOut, hookLen);
  return [a, corner, b];
}

/* =============================== 零件定義 =============================== */
const CATS = {};

/* ---------------------------- 鋼筋 -------------------------------------- */
CATS['鋼筋'] = [
  { id:'bar', name:'直筋', unit:'主筋 / 板筋', note:'CNS 560 竹節鋼筋，現場常用 9 m 或 12 m 定尺',
    p:{ bar:{label:'號數',opts:['#3','#4','#5','#6','#7','#8'],def:'#6'},
        len:{label:'長度 (m)',min:0.5,max:6,step:0.1,def:2.0} },
    build:p => barPolyline([P(-p.len/2,0), P(p.len/2,0)], REBAR[p.bar]/2000) },

  { id:'barL', name:'L 形彎筋', unit:'錨定 / 角隅', note:'90° 彎折，錨定長度依設計（常 40d 以上）',
    p:{ bar:{label:'號數',opts:['#3','#4','#5','#6','#7','#8'],def:'#6'},
        a:{label:'長邊 (m)',min:0.3,max:3,step:0.1,def:1.2},
        b:{label:'短邊 (m)',min:0.1,max:1.5,step:0.05,def:0.4} },
    build:p => { const r=REBAR[p.bar]/2000;
      return barPolyline([P(-p.a/2,0), P(p.a/2,0), P(p.a/2,p.b)], r); } },

  { id:'barU', name:'U 形筋', unit:'樑端 / 開口補強', note:'兩端 90° 向上，開口補強常用',
    p:{ bar:{label:'號數',opts:['#3','#4','#5','#6','#7','#8'],def:'#5'},
        w:{label:'寬 (m)',min:0.1,max:1.2,step:0.05,def:0.5},
        h:{label:'高 (m)',min:0.1,max:1.2,step:0.05,def:0.4} },
    build:p => { const r=REBAR[p.bar]/2000;
      return barPolyline([P(-p.w/2,0), P(-p.w/2,p.h), P(p.w/2,p.h), P(p.w/2,0)], r); } },

  { id:'stirrup', name:'方箍（閉合箍筋）', unit:'柱箍筋 #3', note:'閉合箍 + 135° 彎鉤，鉤長 6d；間距常 15 cm',
    p:{ bar:{label:'箍筋號數',opts:['#3','#4'],def:'#3'},
        w:{label:'柱寬-保護層 (m)',min:0.15,max:1.1,step:0.05,def:0.32},
        h:{label:'柱深-保護層 (m)',min:0.15,max:1.1,step:0.05,def:0.32} },
    build:p => { const r=REBAR[p.bar]/2000, hook=Math.max(6*REBAR[p.bar]/1000,0.06);
      const a=p.w/2, b=p.h/2;
      const pts = [ P(a,-b), P(a,b), P(-a,b), P(-a,-b), P(a,-b), P(a,-b+hook), P(a+hook*0.7,-b+hook*0.7) ];
      return barPolyline(pts, r); } },

  { id:'tie', name:'拉筋（繫筋）', unit:'柱、樑側', note:'兩端 135° 彎鉤，鈎住主筋；地震區常全數施作',
    p:{ bar:{label:'號數',opts:['#3','#4'],def:'#3'},
        len:{label:'長度 (m)',min:0.15,max:1.0,step:0.05,def:0.34} },
    build:p => { const r=REBAR[p.bar]/2000, hk=Math.max(6*REBAR[p.bar]/1000,0.06), h=p.len/2;
      const d=hk*0.707;
      // 兩端 135° 彎鉤（勾住主筋），像釘書針
      return barPolyline([ P(-h+d, d), P(-h,0), P(h,0), P(h-d, d) ], r); } },

  { id:'slabbar', name:'板筋（兩端彎鉤）', unit:'樓板', note:'兩端 90° 彎鉤，上下層雙向配置；保護層 2 cm',
    p:{ bar:{label:'號數',opts:['#3','#4','#5'],def:'#4'},
        len:{label:'長度 (m)',min:0.5,max:5,step:0.1,def:1.6},
        hook:{label:'彎鉤長 (m)',min:0.03,max:0.3,step:0.01,def:0.08} },
    build:p => { const r=REBAR[p.bar]/2000, h=p.len/2;
      return barPolyline([ P(-h,p.hook), P(-h,0), P(h,0), P(h,p.hook) ], r); } },

  { id:'chair', name:'撐鐵（椅仔鐵）', unit:'板筋支撐', note:'撐住上層鋼筋，常 1 m 一支',
    p:{ bar:{label:'號數',opts:['#3','#4'],def:'#3'},
        h:{label:'高度 (m)',min:0.05,max:0.3,step:0.01,def:0.12} },
    build:p => { const r=REBAR[p.bar]/2000, hh=p.h;
      return barPolyline([ P(-0.15,hh), P(-0.10,0), P(0.10,0), P(0.15,hh) ], r); } },

  { id:'beamstirrup', name:'樑箍（矩形）', unit:'樑', note:'閉合矩形箍 + 135° 鉤；樑寬扣除保護層',
    p:{ bar:{label:'號數',opts:['#3','#4'],def:'#3'},
        w:{label:'樑寬-保護層 (m)',min:0.15,max:0.7,step:0.05,def:0.32},
        h:{label:'樑深-保護層 (m)',min:0.2,max:1.1,step:0.05,def:0.55} },
    build:p => { const r=REBAR[p.bar]/2000, hook=Math.max(6*REBAR[p.bar]/1000,0.06);
      const a=p.w/2, b=p.h/2;
      const pts=[ P(a,-b), P(a,b), P(-a,b), P(-a,-b), P(a,-b), P(a,-b+hook), P(a+hook*0.7,-b+hook*0.7) ];
      return barPolyline(pts, r); } },

  { id:'lap', name:'搭接段', unit:'續接', note:'搭接長度依設計（常 40d），錯開配置',
    p:{ bar:{label:'號數',opts:['#3','#4','#5','#6','#7','#8'],def:'#6'},
        d:{label:'搭接長度 (m)',min:0.2,max:2,step:0.05,def:0.8} },
    build:p => { const r=REBAR[p.bar]/2000, y=r*2.4;
      return mergeGeometries([
        barPolyline([P(-p.d*0.55,0), P(p.d*0.45,0)], r),
        barPolyline([P(-p.d*0.45,y), P(p.d*0.55,y)], r),
      ]); } },
];

/* ---------------------------- 模板 -------------------------------------- */
CATS['模板'] = [
  { id:'ply', name:'膠合板（4×8 呎）', unit:'模板面板', note:'122×244 cm × 18 mm，台灣模版主流尺寸',
    p:{ w:{label:'寬 (m)',min:0.3,max:2.5,step:0.05,def:TWW(1.219)},
        h:{label:'高 (m)',min:0.3,max:3.0,step:0.05,def:2.438},
        t:{label:'厚 (m)',min:0.01,max:0.03,step:0.002,def:0.018},
        stand:{label:'立放',opts:['是','否'],def:'是'} },
    build:p => {
      const {w,h,t} = p;
      const g = p.stand==='是' ? box(h,t,w,0,t/2,0) : box(w,t,h,0,t/2,0);
      return g;
    } },

  { id:'batten', name:'柳安角材 1.5"', unit:'角材 / 橫檔', note:'約 38×38 mm，台灣模板用角材；長度依需要裁切',
    p:{ len:{label:'長度 (m)',min:0.3,max:3,step:0.1,def:1.2},
        size:{label:'斷面',opts:['1.5"','2"','3"'],def:'1.5"'} },
    build:p => { const s = p.size==='1.5"'?0.038 : p.size==='2"'?0.051 : 0.076;
      return box(p.len, s, s, 0, s/2, 0); } },

  { id:'colclamp', name:'柱箍（雙鋼管）', unit:'柱模板束緊', note:'兩根 φ48.6 鋼管 + 四角扣件，每 50 cm 一道',
    p:{ a:{label:'柱寬 (m)',min:0.2,max:1.2,step:0.05,def:0.4},
        b:{label:'柱深 (m)',min:0.2,max:1.2,step:0.05,def:0.4},
        g:{label:'模板+角材厚 (m)',min:0.05,max:0.15,step:0.005,def:0.08} },
    build:p => { const R=TW.clampTube/2, off=p.g+R;
      const rx=p.a/2+off, rz=p.b/2+off;
      const gs=[];
      for (const dy of [-R*0.8, R*0.8]) {
        gs.push(cyl(R, rz*2, 0, dy,  rx, 'z'));
        gs.push(cyl(R, rz*2, 0, dy, -rx, 'z'));
        gs.push(cyl(R, rx*2,  rz, dy, 0, 'x'));
        gs.push(cyl(R, rx*2, -rz, dy, 0, 'x'));
      }
      for (const sx of [-1,1]) for (const sz of [-1,1])
        gs.push(box(0.055,0.055,0.055, sx*rx, 0, sz*rz));
      return mergeGeometries(gs); } },

  { id:'tierod', name:'對拉螺栓（含山型螺母）', unit:'牆模、樑模', note:'φ11 穿樑螺栓，兩端蝴蝶扣/山型螺母',
    p:{ len:{label:'長度 (m)',min:0.2,max:1.5,step:0.05,def:0.6} },
    build:p => { const R=0.0055;
      return mergeGeometries([
        cyl(R, p.len, 0, 0, 0, 'x'),
        cyl(0.012, 0.03, -p.len/2+0.015, 0, 0, 'x'),
        cyl(0.012, 0.03,  p.len/2-0.015, 0, 0, 'x'),
        box(0.09, 0.09, 0.008, -p.len/2+0.05, 0, 0),
        box(0.09, 0.09, 0.008,  p.len/2-0.05, 0, 0),
      ]); } },

  { id:'beamclamp', name:'樑箍（雙鋼管）', unit:'樑模板', note:'樑側雙鋼管 + 對拉螺栓，每 45 cm 一道',
    p:{ w:{label:'樑寬 (m)',min:0.2,max:0.8,step:0.05,def:0.4},
        h:{label:'側模高 (m)',min:0.2,max:1.2,step:0.05,def:0.55} },
    build:p => { const R=TW.clampTube/2, span=p.w/2+0.09;
      const gs=[];
      for (const s of [-1,1]) gs.push(cyl(R, span*2, 0, s*p.h*0.35, 0, 'z'));
      gs.push(cyl(0.006, span*2+0.1, 0, p.h*0.35, 0, 'z'));
      return mergeGeometries(gs); } },

  { id:'sole', name:'柱腳固定（壓腳）', unit:'柱模底部', note:'柱模底部以角材＋釘固定於樓板，防止跑模',
    p:{ a:{label:'柱寬 (m)',min:0.2,max:1.2,step:0.05,def:0.4} },
    build:p => { const s=TW.batten, w=p.a+0.2;
      const gs=[];
      for (const sz of [-1,1]) gs.push(box(w, s, s, 0, s/2, sz*(p.a/2+0.06)));
      for (const sx of [-1,1]) gs.push(box(s, s, w, sx*(p.a/2+0.06), s/2, 0));
      return mergeGeometries(gs); } },
];

/* ---------------------------- 施工架 ------------------------------------ */
CATS['施工架'] = [
  { id:'frame', name:'門型架（一榀）', unit:'主架', note:'1.83 m 寬 × 1.90 m 高，φ48.6 鋼管，含框內交叉斜撐',
    p:{ w:{label:'寬 (m)',min:1.0,max:2.0,step:0.05,def:1.83},
        h:{label:'高 (m)',min:1.2,max:2.2,step:0.05,def:1.90} },
    build:p => { const R=TW.tube/2, W=p.w, H=p.h, gs=[];
      for (const x of [-W/2, W/2]) {
        gs.push(cyl(R, H, x, H/2, 0));
        gs.push(box(0.14,0.012,0.14, x, 0.006, 0));
        gs.push(cyl(R*0.62, 0.09, x, 0.10, 0));
      }
      gs.push(cyl(R*0.45, W, 0, 0.14, 0, 'x'));
      gs.push(cyl(R*0.45, W, 0, H-0.14, 0, 'x'));
      const len=Math.hypot(W, H-0.28), ang=Math.atan2(H-0.28, W);
      for (const s of [1,-1]) {
        const g=new THREE.CylinderGeometry(R*0.34,R*0.34,len,8);
        g.rotateZ(Math.PI/2 - ang*s); g.translate(0, H/2, 0); gs.push(g);
      }
      return mergeGeometries(gs); } },

  { id:'cross', name:'交叉拉桿', unit:'架間', note:'每跨每層一組，內外側都要裝；端立架及轉角處必裝',
    p:{ w:{label:'跨距 (m)',min:1.0,max:2.0,step:0.05,def:1.83},
        h:{label:'層高 (m)',min:1.2,max:2.2,step:0.05,def:1.90} },
    build:p => { const R=TW.tube*0.4;
      const len=Math.hypot(p.w,p.h), ang=Math.atan2(p.h,p.w);
      const gs=[];
      for (const s of [1,-1]) {
        const g=new THREE.CylinderGeometry(R,R,len,8);
        g.rotateZ(Math.PI/2 - ang*s); g.translate(0,0,0); gs.push(g);
      }
      return mergeGeometries(gs); } },

  { id:'plank', name:'沖孔踏板', unit:'工作台', note:'金屬沖孔板，兩端扣鎖；板間縫隙須 < 3 cm',
    p:{ len:{label:'長 (m)',min:0.5,max:2.0,step:0.05,def:1.83},
        w:{label:'寬 (m)',min:0.15,max:0.6,step:0.01,def:0.24} },
    build:p => { const gs=[];
      gs.push(box(p.len, 0.05, p.w, 0, 0.025, 0));
      for (const s of [-1,1]) {
        gs.push(box(0.04, 0.09, 0.04, s*(p.len/2-0.03), 0.045,  p.w/2-0.02));
        gs.push(box(0.04, 0.09, 0.04, s*(p.len/2-0.03), 0.045, -p.w/2+0.02));
      }
      return mergeGeometries(gs); } },

  { id:'post', name:'護欄立柱', unit:'護欄', note:'φ33 鋼管立柱，插在踏板端或立桿上',
    p:{ h:{label:'高 (m)',min:0.6,max:1.2,step:0.05,def:0.95} },
    build:p => cyl(TW.rail/2, p.h, 0, p.h/2, 0) },

  { id:'rail', name:'欄杆（上/中）', unit:'護欄', note:'上欄杆 90 cm、中欄杆 45 cm，φ33 鋼管',
    p:{ len:{label:'長 (m)',min:0.5,max:6,step:0.1,def:1.83},
        which:{label:'位置',opts:['上欄杆','中欄杆'],def:'上欄杆'} },
    build:p => cyl(TW.rail/2, p.len, 0, 0, 0, 'x') },

  { id:'toe', name:'踢腳板 18 cm', unit:'護欄', note:'高度 18 cm，防止工具材料掉落',
    p:{ len:{label:'長 (m)',min:0.5,max:6,step:0.1,def:1.83} },
    build:p => box(p.len, TW.toe, 0.012, 0, TW.toe/2, 0) },

  { id:'basejack', name:'可調基腳座板', unit:'施工架底部', note:'調整高度、分散載重；基礎須平整夯實',
    p:{ h:{label:'調整高 (m)',min:0.05,max:0.5,step:0.01,def:0.2} },
    build:p => mergeGeometries([
      box(0.15,0.012,0.15, 0,0.006,0),
      cyl(TW.tube/2, p.h, 0, p.h/2+0.01, 0),
      cyl(TW.tube*0.62, 0.06, 0, p.h*0.55, 0),
    ]) },

  { id:'walltie', name:'壁連座（繫牆桿）', unit:'與構造物連結', note:'縱向 5.5 m、橫向 4.5 m 一道，須鎖在結構體上',
    p:{ len:{label:'長 (m)',min:0.5,max:2,step:0.05,def:1.3} },
    build:p => mergeGeometries([
      cyl(TW.tube/2, p.len, 0, 0, -p.len/2, 'z'),
      box(0.10,0.10,0.012, 0, 0, -p.len),
      box(0.05,0.05,0.05, 0, 0, 0),
    ]) },
];

/* ---------------------------- 支撐 -------------------------------------- */
CATS['支撐'] = [
  { id:'prop', name:'可調鋼管支柱（烏龜）', unit:'CNS 5644', note:'φ48.6×2.3 mm，常用 2.1–3.6 m；底板+調整螺帽+U 型托座',
    p:{ h:{label:'高度 (m)',min:1.5,max:4,step:0.05,def:2.8} },
    build:p => mergeGeometries([
      box(0.14,0.012,0.14, 0,0.006,0),
      cyl(TW.tube/2, p.h, 0, p.h/2+0.01, 0),
      cyl(TW.tube*0.62, 0.10, 0, 0.35, 0),
      box(0.10,0.008,0.05, 0, p.h+0.012, 0),
      box(0.05,0.008,0.10, 0, p.h+0.012, 0),
    ]) },

  { id:'mainjoist', name:'大樑母索', unit:'模板支撐頂部', note:'90×90 角材，沿主樑方向放在支柱 U 型托座上',
    p:{ len:{label:'長 (m)',min:0.6,max:4,step:0.1,def:2.4} },
    build:p => box(p.len, 0.09, 0.09, 0, 0.045, 0) },

  { id:'subjoist', name:'小樑母索', unit:'模板支撐頂部', note:'38×90 角材，垂直大樑母索，間距約 30 cm',
    p:{ len:{label:'長 (m)',min:0.6,max:4,step:0.1,def:1.6} },
    build:p => box(p.len, 0.09, 0.038, 0, 0.045, 0) },

  { id:'tiebar', name:'水平繫條', unit:'§23 規定', note:'支柱高 > 3.5 m 時每 2 m 設縱橫水平繫條',
    p:{ len:{label:'長 (m)',min:0.6,max:4,step:0.1,def:2.4} },
    build:p => cyl(TW.tube/2*0.95, p.len, 0, 0, 0, 'x') },

  { id:'diag', name:'交叉斜撐', unit:'§23 規定', note:'最上層及每 5 層以內設置，X 型交叉',
    p:{ w:{label:'跨 (m)',min:0.6,max:4,step:0.1,def:2.4},
        h:{label:'高 (m)',min:1,max:4,step:0.1,def:2.0} },
    build:p => { const R=TW.tube*0.4;
      const len=Math.hypot(p.w,p.h), ang=Math.atan2(p.h,p.w);
      const gs=[];
      for (const s of [1,-1]) {
        const g=new THREE.CylinderGeometry(R,R,len,8);
        g.rotateZ(Math.PI/2 - ang*s); gs.push(g);
      }
      return mergeGeometries(gs); } },
];

/* ---------------------------- 混凝土 ------------------------------------ */
CATS['混凝土'] = [
  { id:'col', name:'柱', unit:'CNS 3090', note:'斷面與強度依設計；常用 210/280/350 kgf/cm²',
    p:{ a:{label:'寬 (m)',min:0.2,max:1.2,step:0.05,def:0.4},
        b:{label:'深 (m)',min:0.2,max:1.2,step:0.05,def:0.4},
        h:{label:'高 (m)',min:0.5,max:5,step:0.1,def:2.8} },
    build:p => box(p.a, p.h, p.b, 0, p.h/2, 0) },
  { id:'beam', name:'樑', unit:'CNS 3090', note:'樑深含版厚',
    p:{ L:{label:'長 (m)',min:1,max:12,step:0.5,def:6},
        bw:{label:'寬 (m)',min:0.2,max:0.8,step:0.05,def:0.4},
        bh:{label:'深 (m)',min:0.3,max:1.2,step:0.05,def:0.7} },
    build:p => box(p.L, p.bh, p.bw, 0, p.bh/2, 0) },
  { id:'slab', name:'版', unit:'CNS 3090', note:'厚度依設計，常用 15–20 cm',
    p:{ L:{label:'長 (m)',min:1,max:10,step:0.5,def:4},
        W:{label:'寬 (m)',min:1,max:10,step:0.5,def:4},
        t:{label:'厚 (m)',min:0.1,max:0.4,step:0.01,def:0.15} },
    build:p => box(p.L, p.t, p.W, 0, p.t/2, 0) },
  { id:'wall', name:'牆', unit:'CNS 3090', note:'常用 15–25 cm',
    p:{ L:{label:'長 (m)',min:0.6,max:8,step:0.2,def:3},
        h:{label:'高 (m)',min:0.6,max:5,step:0.1,def:2.8},
        t:{label:'厚 (m)',min:0.1,max:0.4,step:0.01,def:0.2} },
    build:p => box(p.L, p.h, p.t, 0, p.h/2, 0) },
];

function TWW(v){ return v; }   // 佔位：讓上面的預設值可讀

/* ------------------------------------------------------------------ UI */
const state = { cat:'鋼筋', part:'bar', vals:{} };
const group = new THREE.Group();
scene.add(group);

function partDef(cat, id) { return (CATS[cat]||[]).find(x=>x.id===id); }
function valsFor(key, def) {
  if (state.vals[key]) return state.vals[key];
  const v = {};
  for (const [k,s] of Object.entries(def.p)) v[k] = s.def;
  state.vals[key] = v;
  return v;
}

function buildCats() {
  const wrap = document.getElementById('cats');
  wrap.innerHTML = '';
  Object.keys(CATS).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.className = (c === state.cat ? 'on' : '');
    b.onclick = () => {
      state.cat = c;
      state.part = CATS[c][0].id;
      buildCats(); buildList(); buildParams(); rebuild();
    };
    wrap.appendChild(b);
  });
}

function buildList() {
  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  CATS[state.cat].forEach(d => {
    const el = document.createElement('div');
    el.className = 'item' + (d.id === state.part ? ' on' : '');
    el.innerHTML = `<span>${d.name}</span><i>${d.unit}</i>`;
    el.onclick = () => { state.part = d.id; buildList(); buildParams(); rebuild(); };
    wrap.appendChild(el);
  });
}

function buildParams() {
  const def = partDef(state.cat, state.part);
  const key = state.cat + '/' + state.part;
  const vals = valsFor(key, def);
  const wrap = document.getElementById('params');
  wrap.innerHTML = '';
  document.getElementById('title').textContent = def.name;
  document.getElementById('desc').textContent = def.unit;
  document.getElementById('spec').textContent = def.note || '';

  for (const [k, s] of Object.entries(def.p)) {
    const row = document.createElement('div');
    row.className = 'p';
    if (s.opts) {
      row.innerHTML = `<label>${s.label}</label><div class="row"></div>`;
      const r = row.querySelector('.row');
      s.opts.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o;
        b.className = (String(vals[k]) === String(o) ? 'on' : '');
        b.onclick = () => { vals[k] = o; buildParams(); rebuild(); };
        r.appendChild(b);
      });
    } else {
      row.innerHTML = `<label>${s.label}<b>${vals[k]}</b></label>
        <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${vals[k]}">`;
      row.querySelector('input').oninput = (e) => {
        vals[k] = +e.target.value;
        row.querySelector('b').textContent = vals[k];
        rebuild();
      };
    }
    wrap.appendChild(row);
  }
}

function rebuild() {
  const def = partDef(state.cat, state.part);
  const key = state.cat + '/' + state.part;
  const vals = state.vals[key];
  while (group.children.length) {
    const c = group.children.pop();
    c.geometry?.dispose();
  }
  let geo;
  try { geo = def.build(vals); } catch (e) { console.error(e); return; }
  if (!geo) return;
  const mat = state.cat === '鋼筋' ? MAT.rebar()
            : state.cat === '模板' ? (def.id === 'ply' ? MAT.ply()
              : def.id === 'batten' || def.id === 'sole' ? MAT.timber()
              : def.id === 'plank' || def.id === 'toe' ? MAT.galv() : MAT.steel())
            : state.cat === '施工架' ? (def.id === 'plank' ? MAT.deck() : MAT.galv())
            : state.cat === '支撐' ? (def.id.includes('joist') ? MAT.timber() : MAT.steel())
            : MAT.conc();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  const n = geo.index ? geo.index.count : geo.attributes.position.count;
  document.getElementById('stat').textContent =
    `${Math.round(n/3).toLocaleString()} 三角形 · 拖曳旋轉 · 滾輪縮放`;
  fitView();
}

function fitView() {
  const bb = new THREE.Box3().setFromObject(group);
  if (bb.isEmpty()) return;
  const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.y, s.z) * 1.5;
  controls.target.copy(c);
  camera.position.set(c.x + d*0.66, c.y + d*0.5, c.z + d*0.8);
  controls.update();
}

buildCats(); buildList(); buildParams(); rebuild();
window.__ready = true;
window.__dbg = { state, rebuild, CATS };

addEventListener('resize', () => {
  const w = innerWidth - 238;
  camera.aspect = w / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(w, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
